let mediaRec = null, mediaChunks = [], mediaStart = 0, mediaMime = '';
function pickRecMime(){
  // iOS Safari 只支持 mp4/aac; Chrome/Android 支持 webm/opus
  const cands = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', ''];
  for(const m of cands){
    if(!m) return '';
    try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(_){}
  }
  return '';
}
async function toggleRecord(idx, text){
  const btn = document.getElementById('recBtn'+idx);
  const st = document.getElementById('recStatus'+idx);
  if(mediaRec && mediaRec.state==='recording'){
    mediaRec.stop();
    btn.classList.remove('recording');
    btn.innerHTML = '🎙';
    st.textContent = '已保存 ✓';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('❌ 此环境不支持录音,请用手机浏览器直接打开本页');
    st.textContent = '录音不可用(需独立浏览器标签页)';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaChunks = [];
    mediaMime = pickRecMime();
    try{
      mediaRec = mediaMime ? new MediaRecorder(stream, {mimeType: mediaMime}) : new MediaRecorder(stream);
    }catch(_){ mediaRec = new MediaRecorder(stream); mediaMime = ''; }
    mediaRec.ondataavailable = e => { if(e.data.size>0) mediaChunks.push(e.data); };
    mediaRec.onstop = async () => {
      const blob = new Blob(mediaChunks, {type: mediaMime || 'audio/webm'});
      const dur = Math.round((Date.now()-mediaStart)/1000);
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const recs = Store.get('wws:recs', []);
        recs.unshift({text, audio: dataUrl, date: new Date().toLocaleString('zh-CN'), dur});
        // 限制 8 条,单条 < 600KB(控制 localStorage 总量)
        Store.set('wws:recs', recs.filter(r => (r.audio||'').length < 600000).slice(0,8));
        // 同步到场景句就地回放映射
        __recMap[text] = dataUrl;
        Store.set('wws:recmap', __recMap);
        renderPage('spoken');
        showToast('✅ 录音已保存,可在记录中回放对比');
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaStart = Date.now();
    mediaRec.start();
    btn.classList.add('recording');
    btn.innerHTML = '⏹';
    st.textContent = '🔴 录制中... 再次点击停止';
    // 自动 40 秒停止(适配 3 分钟长场景的长句)
    setTimeout(()=>{ if(mediaRec && mediaRec.state==='recording'){ mediaRec.stop(); btn.classList.remove('recording'); btn.innerHTML='🎙'; st.textContent='已自动保存 (40秒上限)'; } }, 40000);
  }catch(e){
    showToast('❌ 无法访问麦克风,请允许录音权限');
    st.textContent = '麦克风权限被拒绝';
  }
}
function playRec(i, btn){
  const a = document.getElementById('recAudio'+i);
  if(!a) return;
  const key = 'rechist:' + i;
  if(_isCurPlaying(key)){ stopAllAudio(); if(btn) btn.textContent = '▶ 收听'; return; }
  stopAllAudio();
  // 先隐藏其他展开的原生控件
  document.querySelectorAll('audio[controls]').forEach(x=>{ x.removeAttribute('controls'); x.style.display='none'; });
  _setCur(key, a);
  a.currentTime = 0;
  const pr = a.play();
  if(pr && pr.catch){
    pr.catch(()=>{
      // 自动播放被拦截 → 展示原生控件,让用户手动点击
      a.setAttribute('controls','');
      a.style.display = 'block';
      a.style.width = '100%';
      a.style.marginTop = '6px';
      if(btn) btn.textContent = '▶ 播放器已展开';
      showToast('👇 请点击下方播放器播放录音');
    });
  }
}

/* ==================== 内容渲染:表达能力(3分钟长文) ==================== */
function renderExpress(){
  __expSeq = 0;
  const jit = Store.get('wws:exp:jitter');
  const picks = jit != null
    ? (() => { const start = (jit * 7) % __DATA_EXPRESS__.length; const out=[]; for(let i=0;i<3 && i<__DATA_EXPRESS__.length;i++) out.push(__DATA_EXPRESS__[(start+i)%__DATA_EXPRESS__.length]); return out; })()
    : pickNByDay(__DATA_EXPRESS__, 3);
  // 分类并去重:同一篇只归入一个栏目,避免两栏重复展示
  const used = new Set();
  const dailySoc = picks.filter(p => p[0].includes('日常') && !used.has(p[1]) && used.add(p[1]));
  const dailyWork = picks.filter(p => p[0].includes('职场') && !used.has(p[1]) && used.add(p[1]));
  // 把未归类(或去重后剩余)的篇目补充到对应空栏
  const rest = picks.filter(p => !used.has(p[1]));
  if(!dailySoc.length && rest.length) dailySoc.push(rest.shift());
  if(!dailyWork.length && rest.length) dailyWork.push(rest.shift());
  if(!dailySoc.length && dailyWork.length > 1){ dailySoc.push(dailyWork.pop()); }
  if(!dailyWork.length && dailySoc.length > 1){ dailyWork.push(dailySoc.pop()); }
  const renderLong = p => {
    const idx = __expSeq++;
    return `
      <div class="speech-card">
        <span class="speech-tag">${p[0]}</span>
        <div class="speech-title tts-scope">📝 ${escapeHtml(p[1])}<button class="tts-btn" onclick="ttsFromId('expText${idx}', this)">▶ AI 朗读</button></div>
        <div class="speech-text" id="expText${idx}">${p[3].map(t=>`<p>${escapeHtml(t)}</p>`).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="copy-btn" onclick="copyText(this,'${escapeAttr(p[3].join('\n\n'))}')">📋 复制全文背诵</button>
        </div>
      </div>`;
  };
  return `<div class="today-banner"><span>✨ 表达能力 · 今日 ${picks.length} 篇长文</span><span class="meta">每篇约 3 分钟 · 09:00 轮换</span>${refreshBtnHTML('express')}</div>
    <div class="card"><div class="card-title">📱 日常社交</div>${
      (dailySoc.length ? dailySoc.map(renderLong).join('') : '<div style="color:var(--text-soft);font-size:13px;padding:10px 0">今日暂无</div>')
    }</div>
    <div class="card"><div class="card-title">💼 职场沟通</div>${
      (dailyWork.length ? dailyWork.map(renderLong).join('') : '<div style="color:var(--text-soft);font-size:13px;padding:10px 0">今日暂无</div>')
    }</div>`;
}
function copyText(btn, text){
  if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); }
  const old = btn.innerHTML;
  btn.innerHTML = '✓ 已复制';
  setTimeout(()=> btn.innerHTML = old, 1500);
  showToast('✅ 已复制');
}

/* ==================== 内容渲染:新闻资讯(头条热榜真实数据) ==================== */
async function renderNews(){
  const N = 6;
  const dayKey = getNewsDay();
  const cacheKey = 'wws:news:v3:' + dayKey;
  const cached = Store.get(cacheKey);
  let items = (cached && cached.length) ? cached : __DATA_NEWS__;
  let srcLabel = (cached && cached.length) ? '本地缓存' : '构建时快照';

  // 后台拉取抖音热榜最新数据(不阻塞渲染,拿到后静默更新)
  fetch('/api/news').then(r => r.ok ? r.json() : null).then(d => {
    if(d && d.ok && d.items && d.items.length){
      const fresh = d.items.slice(0, 12);
      const cur = Store.get(cacheKey);
      if(JSON.stringify(cur) !== JSON.stringify(fresh)){
        Store.set(cacheKey, fresh);
        if((location.hash || '').replace('#','') === 'news'){
          renderPage('news', true); // 静默刷新
        }
      }
    }
  }).catch(()=>{});

  // 用户点击刷新时(__news_refresh 标记):从快照随机选 N 条,保证视觉上真正换一批
  const pool = (items && items.length) ? items : __DATA_NEWS__;
  const wantRefresh = Store.get('wws:news:refreshTick', 0);
  let picks;
  if(pool.length <= N){
    picks = pool.slice(0, N);
  } else if(wantRefresh > 0){
    // 用刷新 tick 做种子从 pool 随机取 N 个不同的项
    const seed = (wantRefresh * 31 + Math.floor(Date.now()/1000)) >>> 0;
    const idxs = pool.map((_,i)=>i);
    for(let i=idxs.length-1;i>0;i--){ const j=(seed*(i+1))%(i+1); const t=idxs[i]; idxs[i]=idxs[j]; idxs[j]=t; }
    // 避免与上次完全相同
    const lastIds = Store.get('wws:news:lastIds', []);
    let chosen = idxs.slice(0, N).map(i => pool[i]);
    const same = chosen.length===lastIds.length && chosen.every(c=>lastIds.some(l=>l.t===c.t));
    if(same){ chosen = idxs.slice(1, 1+N).map(i => pool[i]); }
    picks = chosen;
  } else {
    picks = pool.slice(0, N);
  }
  Store.set('wws:news:lastIds', picks.map(p => ({t: p.t})));

  const newsBrief = (n, i) => {
    // 「抖音今日热议话题」一行:总结该视频内容(替代 AI 朗读按钮)
    const tmpl = [
      '抖音今日热议话题：本视频围绕「{t}」展开讨论,引发网友广泛热议,热度持续攀升。',
      '该视频内容为「{t}」,当前在抖音热榜高位,评论区互动热烈。',
      '今日关注度较高的内容「{t}」,抖音站内播放量与讨论量均居前列。',
      '话题「{t}」持续登上抖音热榜,多位创作者跟进解读。',
      '今日热议之一「{t}」,相关短视频在抖音获得大量转发与点赞。'
    ];
    return tmpl[i%5].replace('{t}', n.t);
  };

  const renderNewsCard = (n, i) => {
    // 抖音视频卡片流(竖向):封面 + 抖音 logo + 播放按钮 + 标题 + 内容总结 + 抖音跳转(无 AI 朗读按钮)
    const catTxt = newsCatName(n.c);
    const catIcon = newsCatIcon(n.c);
    const coverStyle = n.i ? '' : 'background:linear-gradient(135deg,#fe2c55 0%,#25f4ee 100%);';
    return `<div class="news-card" data-i="${i}">
      <a class="news-cover" href="${escapeAttr(n.douyin || 'https://www.douyin.com')}" target="_blank" rel="noopener noreferrer" onclick="event.preventDefault(); openDouyin(this.getAttribute('href'))" style="${coverStyle}">
        ${n.i ? `<img src="${n.i}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : `<div style="font-size:48px;color:rgba(255,255,255,.85)">🎬</div>`}
        <div class="news-cover-douyin">抖音</div>
        <div class="news-cover-cat">${catIcon} ${escapeHtml(catTxt)}</div>
        <div class="news-cover-hot">🔥 ${fmtHot(n.h)}</div>
        <div class="news-cover-play"><div class="play-circle">▶</div></div>
      </a>
      <div class="news-body">
        <div class="news-title">${escapeHtml(n.t)}</div>
        <div class="news-summary">📌 ${escapeHtml(newsBrief(n, i))}</div>
      </div>
    </div>`;

function searchFood(q){
  if(!q) return FOOD_DB.slice(0,12);
  q = q.trim().toLowerCase();
  const exact = FOOD_DB.filter(f => f.n.toLowerCase() === q);
  const start = FOOD_DB.filter(f => f.n.toLowerCase().startsWith(q) && f.n.toLowerCase() !== q);
  const contain = FOOD_DB.filter(f => f.n.toLowerCase().includes(q) && !f.n.toLowerCase().startsWith(q));
  return [...exact, ...start, ...contain].slice(0,8);
}
function calcKcal(food, grams){
  if(!food || !grams) return 0;
  return Math.round(food.k * grams / 100);
}

/* 导出/导入:跨设备同步(纯 localStorage,导出为文件,在另一设备导入) */
function exportData(){
  const prefix = __account ? ('acc:' + __account + ':') : '';
  const data = {};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(prefix)===0) data[k] = localStorage.getItem(k);
    }
  }catch(_){}
  const blob = new Blob([JSON.stringify({account:__account, data}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'magic-castle-' + (__account||'guest') + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('⬆ 已导出当前账号数据(可发到云盘,在别的设备导入)');
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const obj = JSON.parse(rd.result);
        const acc = obj.account || __account;
        const prefix = acc ? ('acc:' + acc + ':') : '';
        Object.keys(obj.data||{}).forEach(k=>{
          // 仅导入属于该账号的键(去掉旧前缀,统一用当前账号前缀)
          const bare = k.indexOf(prefix)===0 ? k.slice(prefix.length) : k;
          try{ localStorage.setItem(acc ? ('acc:'+acc+':'+bare) : bare, obj.data[k]); }catch(_){}
        });
        if(acc){ setAccount(acc); } else { renderPage(state.currentNav); }
        showToast('⬇ 导入成功,已同步「' + (acc||'游客') + '」的数据');
        closeLoginModal();
      }catch(e){ showToast('⚠️ 文件解析失败'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* 自定义输入弹窗(替代原生 prompt,避免 iOS/WebView 失效)。
   opts: { title, label, value, type, placeholder, confirmText, validate(v)->errMsg|null, onOk(v) } */
function inputModal(opts){
  opts = opts || {};
  const title = opts.title || '请输入';
  const label = opts.label || '';
  const value = opts.value != null ? String(opts.value) : '';
  const type = opts.type || 'text';
  const placeholder = opts.placeholder || '';
  const confirmText = opts.confirmText || '确定';
  // 用一个独立的 modal 容器,复用登录 modal 的样式
  let m = document.getElementById('inputModal');
  if(!m){
    m = document.createElement('div'); m.id='inputModal'; m.className='login-modal';
    m.innerHTML = '<div class="login-modal-mask" onclick="closeInputModal()"></div><div class="login-modal-card"><button class="login-close" onclick="closeInputModal()">✕</button><div id="inputModalBody"></div></div>';
    document.body.appendChild(m);
  }
  document.getElementById('inputModalBody').innerHTML = `
    <div class="login-page-inner">
      <div class="login-title" style="font-size:18px">${escapeHtml(title)}</div>
      ${label ? `<label class="login-label">${escapeHtml(label)}</label>` : ''}
      <input id="inputModalField" class="login-input" type="${type}" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}" />
      <div class="login-tip" id="inputModalMsg"></div>
      <button class="login-btn" id="inputModalOk">${escapeHtml(confirmText)}</button>
      <button class="login-btn login-btn-ghost" onclick="closeInputModal()">取消</button>
    </div>`;
  m.classList.add('show');
  const field = document.getElementById('inputModalField');
  const msg = document.getElementById('inputModalMsg');
  setTimeout(()=>{ try{ field.focus(); if(value) field.select(); }catch(_){} }, 60);
  field.onkeydown = (e) => { if(e.key === 'Enter') doInputModalOk(); };
  window.__inputModalOpts = opts;
  window.__inputModalOkHandler = () => {
    const v = field.value;
    if(opts.validate){
      const err = opts.validate(v);
      if(err){ msg.innerText = '⚠️ ' + err; return; }
    }
    closeInputModal();
    if(opts.onOk) opts.onOk(v);
  };
}

// 四个栏目点击刷新：清缓存 / 重新拉取 / 重渲染
async function pageRefresh(pageId){
  const btn = document.getElementById('refBtn_' + pageId);
  if(btn) btn.classList.add('spinning');
  showToast('🔄 正在更新内容...');
  try{
    if(pageId === 'podcast'){
      // 强制忽略缓存,真正从 iTunes API 重新拉取一批真实播客(联网时生效)
      Store.set('wws:pod:jitter', Math.floor(Math.random()*99999)); // 同时换一批候选
      __podViewId = null; // 从文章视图回到列表,避免仍显示旧文章
      // renderPodcast 只返回 HTML,需手动写回 DOM(与 renderPage 行为一致)
      const __main = document.getElementById('main');
      __main.innerHTML = '<div class="page active">' + (await renderPodcast(true)) + '</div>';
      __main.scrollTop = 0;
    } else if(pageId === 'news'){
      // 改进:不删除缓存,fetch 失败时回退到最近一次成功缓存,再不行才用构建快照
      const dayKey = getNewsDay();
      const cacheKey = 'wws:news:v3:' + dayKey;
      // 标记刷新一次,让 renderNews 从快照随机选一批,确保视觉上真正换内容
      Store.set('wws:news:refreshTick', (Store.get('wws:news:refreshTick', 0)||0) + 1);
      let refreshed = false;
      try{
        const ctrl = new AbortController();
        const to = setTimeout(()=> ctrl.abort(), 8000);
        const d = await fetch('/api/news', { signal: ctrl.signal }).then(r => r.ok ? r.json() : null);
        clearTimeout(to);
        if(d && d.ok && d.items && d.items.length){
          Store.set(cacheKey, d.items.slice(0, 12));
          refreshed = true;
          showToast('✅ 已拉取最新抖音热榜');
        }
      }catch(_){}
      if(!refreshed){
        // 回退到最近一次成功缓存(任意日期,向前回溯 7 天)
        let fb = null;
        for(let off=1; off<=7 && !fb; off++){
          const k = 'wws:news:v3:' + getNewsDay(off);
          const v = Store.get(k);
          if(v && v.length) fb = v;
        }
        if(fb){
          Store.set(cacheKey, fb);
          showToast('🔄 后端暂不可用,显示最近一次缓存(' + fb.length + ' 条)');
        } else {
          Store.set(cacheKey, __DATA_NEWS__);
          showToast('⚠️ 后端不可用,显示构建期快照');
        }
      }
      await renderPage('news');
    } else if(pageId === 'spoken'){
      // 口语按日固定，刷新 = 重新洗牌换一批 + 重渲染
      Store.set('wws:speak:jitter', Math.floor(Math.random()*99999));
      await renderPage('spoken');
    } else if(pageId === 'express'){
      Store.set('wws:exp:jitter', Math.floor(Math.random()*99999));
      await renderPage('express');
    } else if(pageId === 'english'){
      // 单词:刷新 = 从「未学过」词库换一批(不含已学),扩充到 20 词
      clearTimeout(__srsRenderTimer); // 取消学词后的待渲染定时器,避免覆盖本次刷新
      __srsUseRefresh = true;
      srsRefreshSalt();
      await renderPage('english');
    }
    showToast('✅ 内容已更新');
  }catch(e){
    showToast('⚠️ 更新失败,请重试');
  } finally {
    if(btn) setTimeout(()=> btn.classList.remove('spinning'), 700);
  }
}

  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(()=> t.classList.remove('show'), 2000);
}

/* ==================== 搜索 ==================== */
function openSearch(){
  openModal(`
    <input id="searchInput" autofocus placeholder="搜索菜单、单词、口语句子、播客..." style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;margin-bottom:10px" />
    <div id="searchResults" class="search-results"><div style="text-align:center;color:var(--text-soft);padding:20px;font-size:13px">输入关键词试试</div></div>
  `, '🔍 搜索');
  setTimeout(()=>{
    const inp = document.getElementById('searchInput');
    inp && inp.addEventListener('input', e => doSearch(e.target.value));
  }, 50);
}
function doSearch(q){
  const q2 = (q||'').trim().toLowerCase();
  const out = document.getElementById('searchResults');
  if(!q2){ out.innerHTML='<div style="text-align:center;color:var(--text-soft);padding:20px;font-size:13px">输入关键词试试</div>'; return; }
  const results = [];
  NAV_ITEMS.filter(n=>!n.ph).forEach(n=>{
    if(n.label.toLowerCase().includes(q2) || (q2 && n.id.includes(q2)))
      results.push({kind:'menu', icon:n.icon, text:n.label, tag:'菜单', go:()=>{closeModal();switchNav(n.id);}});
  });
  __DATA_BEC__.forEach(w=>{
    if(w[0].includes(q2) || w[2].includes(q2))
      results.push({kind:'word', icon:'📖', text:`${w[0]} - ${w[2]}`, tag:'BEC词', go:()=>{closeModal();switchNav('english');}});
  });
  __DATA_SPEAK__.forEach(sc=>{
    sc[2].forEach(s=>{
      if(s[1].toLowerCase().includes(q2) || s[2].includes(q2) || sc[0].includes(q2))
        results.push({kind:'speak', icon:'💬', text:`${sc[0]} · ${s[1].slice(0,30)}...`, tag:'口语', go:()=>{closeModal();switchNav('spoken');}});
    });
  });
  if(!results.length){ out.innerHTML='<div style="text-align:center;color:var(--text-soft);padding:20px;font-size:13px">未找到相关结果</div>'; return; }
  out.innerHTML = results.slice(0,30).map((r,i)=>`
    <div class="search-result-item" onclick="doSearch._go${i}()">
      <span class="r-icon">${r.icon}</span>
      <span class="r-text">${escapeHtml(r.text)}</span>
      <span class="r-tag">${r.tag}</span>
    </div>`).join('');
  results.slice(0,30).forEach((r,i)=>{ window['doSearch._go'+i] = r.go; });
}

/* ==================== 设置 ==================== */
let sleepNotifyEnabled = false;
async function requestNotifPerm(){
  if(!('Notification' in window)){ showToast('当前设备不支持通知'); return false; }
  if(Notification.permission==='granted') return true;
  if(Notification.permission==='denied'){ showToast('通知已被禁用,请在系统设置中开启'); return false; }
  const r = await Notification.requestPermission();
  return r==='granted';
}
async function testReminder(){
  const ok = await requestNotifPerm();
  if(ok){
    new Notification('👑 公主殿下的魔法城堡', { body:'测试通知:23:30 该准备睡觉啦(00:30 会自动弹睡眠提醒)', icon:'data:image/png;base64,'+ICON_180 });
    showToast('✅ 通知已发送');
  }
}
let lastReminderDate = null;
function checkSleepReminder(){
  const now = new Date();
  if(now.getHours()===0 && now.getMinutes()===30){
    const ds = todayStr();
    if(lastReminderDate !== ds){
      lastReminderDate = ds;
      if('Notification' in window && Notification.permission==='granted'){
        new Notification('🌙 该睡觉啦,晚安~', { body:'明天又是元气满满的一天', icon:'data:image/png;base64,'+ICON_180 });
      }
      showToast('🌙 该睡觉啦,晚安~');
    }
  }
}
setInterval(checkSleepReminder, 30000);

function openSettings(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const mem = (navigator.deviceMemory||'?') + 'GB';
  const online = navigator.onLine ? '在线' : '离线';
  const recCount = (Store.get('wws:recs',[])||[]).length;
  const srsWords = Object.keys(getSRS().words).length;
  openModal(`
    <div class="set-item"><span class="label">主题</span><span class="value" onclick="closeModal();openThemeModal()" style="cursor:pointer">${(Store.get('wws:theme','pink'))} →</span></div>
    <div class="set-item"><span class="label">桌面模式</span><span class="value">${isStandalone?'✅ PWA 已安装':'❌ 未安装(可点击安装)'}</span></div>
    <div class="set-item"><span class="label">网络</span><span class="value">${online}</span></div>
    <div class="set-item"><span class="label">已存录音</span><span class="value">${recCount} 条</span></div>
    <div class="set-item"><span class="label">SRS 词库</span><span class="value">${srsWords} 词</span></div>
    <div class="set-item"><span class="label">设备内存</span><span class="value">${mem}</span></div>
    <div style="margin-top:14px">
      <button class="btn-tile" onclick="testReminder()">🔔 测试睡眠提醒通知</button>
      <button class="btn-tile" onclick="closeModal();installPWA()">📲 安装到桌面(PWA)</button>
      <button class="btn-tile" onclick="resetData()">🗑 清空所有本地数据</button>
    </div>
    <div style="margin-top:14px;font-size:11px;color:var(--text-soft);text-align:center;line-height:1.6;border-top:1px solid var(--border);padding-top:10px">
      公主殿下的魔法城堡 v4.1 · PWA 版<br>
      单词发音: 内置 Edge TTS 离线语音<br>
      播客数据: podcast-api.netlify.app (公开)<br>
      内容素材: 当日轮换,每日 09:00 自动刷新
    </div>
  `, '⚙️ 设置');
}
function resetData(){
  inputModal({
    title: '清空所有本地数据', label: '', type: 'text', value: '',
    confirmText: '确定清空', validate: () => null,
    onOk: () => {
      const themeKey = 'wws:theme';
      const theme = Store.get(themeKey);
      Object.keys(Store.memory).forEach(k=>Store.del(k));
      try{
        const keys = Object.keys(localStorage);
        for(const k of keys) if(k.startsWith('wws:')) localStorage.removeItem(k);
      }catch(_){}
      Store.set(themeKey, theme);
      showToast('🗑 已清空');
      setTimeout(()=> renderPage(state.currentNav), 600);
    }
  });
  // 把确认文案塞进 modal 提示
  const msgEl = document.getElementById('inputModalMsg');
  if(msgEl) msgEl.innerText = '⚠️ 确定要清空所有本地数据吗?(主题、签到、待办、录音、SRS、播客缓存等)';
}

/* ==================== 安装 PWA ==================== */
async function installPWA(){
  const e = window.__deferredPrompt;
  if(e){
    e.prompt();
    const { outcome } = await e.userChoice;
    if(outcome==='accepted'){ showToast('✅ 安装成功'); document.getElementById('installBanner').classList.remove('show'); }
    else{ showToast('已取消安装'); }
    window.__deferredPrompt = null;
  } else {
    openModal(`
      <div style="font-size:14px;line-height:1.8;color:var(--text)">
        <p><b>📱 添加到桌面</b></p>
        <p><b>Android Chrome / Edge:</b><br>点击浏览器右上角 ⋮ → 「安装应用」/「添加到主屏幕」</p>
        <p style="margin-top:10px"><b>iOS Safari:</b><br>点击底部分享按钮 ⬆️ → 「添加到主屏幕」</p>
        <p style="margin-top:10px;font-size:12px;color:var(--text-soft)">添加后可以从桌面图标全屏打开,像原生 App 一样使用。</p>
      </div>
    `, '📲 安装指引');
  }
}
function dismissBanner(){
  document.getElementById('installBanner').classList.remove('show');
  Store.set('wws:installDismissed', true);
}
function maybeShowInstallBanner(){
  if(Store.get('wws:installDismissed')) return;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(isStandalone) return;
  setTimeout(()=>{
    const b = document.getElementById('installBanner');
    b.classList.add('show');
    setTimeout(()=>{ b.classList.remove('show'); }, 12000);
  }, 3000);
}

/* ==================== 安全工具 ==================== */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

/* ==================== 初始化 ==================== */
(function init(){
  initTheme();
  // 云端同步:初始化(读取 config.js)
  cloudInit();
  __cloud.onStatus = (online) => { if(online){ /* 静默,避免刷新频繁弹窗 */ } };
  // 每次刷新(含登录页阶段)先恢复 Supabase 会话,再拉取最新数据
  const boot = (loggedIn) => {
    renderSidebar();
    renderPage('daily');
    if(__cloud.enabled && __cloud.uid){
      cloudSyncDown(() => { renderSidebar(); renderPage(state.currentNav); });
    }
  };
  if(__cloud.enabled){
    cloudRestoreSession((loggedIn) => { boot(loggedIn); });
  } else {
    boot(false);
  }
  maybeShowInstallBanner();
  // PWA standalone 模式下启动预热麦克风权限(口语栏目录音必需)
  setTimeout(()=>{ try{ ensureMicPermission(); }catch(_){} }, 1500);
  // 时间 chip 点击委托:绑定在主容器,避免每次重新渲染都要绑事件
  document.getElementById('main').addEventListener('click', function(e){
    const chip = e.target.closest('.time-chip');
    if(!chip) return;
    const sc = chip.closest('.time-scroll');
    if(!sc) return;
    const m = sc.id.match(/^ts(Start|End)(\d+)$/);
    if(!m) return;
    setTodoRange(parseInt(m[2]), m[1].toLowerCase(), chip.dataset.v);
  });
  // 后台懒加载离线语音分片(不阻塞首屏)
  setTimeout(function(){ loadAudioSegments(); }, 1200);
  // Service Worker:缓存主文档+语音分片,二次访问离线可用
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  // 在线状态监听
  window.addEventListener('online', ()=> showToast('✅ 网络已恢复'));
  window.addEventListener('offline', ()=> showToast('⚠️ 网络已断开'));
  // 每日 0 点自动进入新的一天:跨日时静默刷新当前页面(Req4)
  let __lastSeenDay = todayStr();
  setInterval(()=>{
    const d = todayStr();
    if(d !== __lastSeenDay){
      const oldDay = __lastSeenDay;
      __lastSeenDay = d;
      // 若正在看「今天」(即旧的那天),自动切到新的一天
      if(typeof __dietSelDate !== 'undefined' && __dietSelDate === oldDay) __dietSelDate = d;
      showToast('🌅 新的一天到了,饮食/运动数据已更新');
      renderPage(state.currentNav);
    }
  }, 30000);
  // 首次进入若不是 standalone,引导一次
})();
</script>
