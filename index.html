const __DATA_SPEAK__     = [["咖啡店点单","☕ 生活场景 · 零基础",[["店员","Good morning! Welcome to Rosemary Coffee. What can I get started for you today?","早上好！欢迎光临迷迭香咖啡。今天想喝点什么？"],["你","Good morning! I'd love a latte, please. But first, what sizes do you have?","早上好！我想来一杯拿铁。先问一下，你们有什么杯型？"],["店员","We have three sizes — small, medium, and large. A medium is sixteen ounces, which is our most popular one.","我们有三种杯型——小杯、中杯和大杯。中杯是十六盎司，是我们最受欢迎的。"],["你","I'll go with a medium then. And could I make it iced? It's such a hot day today.","那我要中杯吧。可以做成冰的吗？今天实在太热了。"],["店员","Of course! We have whole milk, oat milk, and almond milk. Which one would you like in your latte?","当然可以！我们有全脂奶、燕麦奶和杏仁奶。您的拿铁想要哪一种？"],["你","Oat milk, please. I've heard it pairs really well with espresso.","请给我燕麦奶。听说它和浓缩咖啡特别搭。"],["店员","It really does — great choice! Would you like any syrup? Vanilla, caramel, and hazelnut are all available today.","确实很搭——好眼光！要加糖浆吗？今天有香草、焦糖和榛子味。"],["你","Hmm, could I have just half a pump of vanilla? I prefer my coffee not too sweet.","嗯，能只加半泵香草吗？我不喜欢咖啡太甜。"],["店员","Not a problem at all. Would you like anything to eat with that? Our croissants just came out of the oven.","完全没问题。要配点吃的吗？我们的可颂刚出炉。"],["你","That sounds tempting! I'll take a butter croissant to go with my latte.","听起来好诱人！那我要一个黄油可颂配拿铁。"],["店员","Perfect combination. Do you have our membership app? You can collect a stamp for every drink.","完美搭配。您有我们的会员 App 吗？每买一杯可以集一个章。"],["你","I just downloaded it this morning, actually. Here's my QR code.","我今天早上刚下载好。这是我的二维码。"],["店员","Scanned! One stamp added. Can I get a name for the order?","扫好了！加了一个章。请问订单用什么名字？"],["你","It's Lily — L-I-L-Y.","莉莉，L-I-L-Y。"],["店员","Thanks, Lily. So that's one medium iced oat-milk latte with half a pump of vanilla, plus a butter croissant. Your total comes to nine fifty.","谢谢莉莉。您点的是一杯中杯冰燕麦奶拿铁加半泵香草，加一个黄油可颂。一共是九块五。"],["你","Sounds right. Can I pay with my card?","没错。可以刷卡吗？"],["店员","Absolutely. Just tap your card right here... All done! Here's your receipt.","当然可以。把卡贴在这里就行……好了！这是您的小票。"],["你","Thank you. Do I pick up my drink here, or somewhere else?","谢谢。饮料是在这里取，还是去别的地方取？"],["店员","We'll call your name when your order is ready. You can wait right over there by the pick-up counter.","做好了我们会叫您的名字。您可以在那边取餐台旁稍等。"],["你","Got it. By the way, is the Wi-Fi password still written on the wall?","明白了。对了，Wi-Fi 密码还是写在墙上吗？"],["店员","Yes, it's on the chalkboard near the window. The outlets under the long table work great if you need to charge your laptop.","是的，在窗户旁边的小黑板上。如果您要给笔记本充电，长桌下面的插座很好用。"],["你","Awesome, I might stay and work for a while then. Could I also get a cup of water?","太好了，那我待会儿可能留下来工作。还能再要杯水吗？"],["店员","Sure, help yourself — the water station is right next to the napkins and straws.","当然，自取就好——饮水台就在餐巾纸和吸管旁边。"],["你","Thank you so much. You've been super helpful. Have a great day!","非常感谢！你帮了大忙。祝你有美好的一天！"],["店员","You too, Lily! Enjoy your latte, and we'll see you soon.","你也是，莉莉！好好享用你的拿铁，欢迎下次再来。"]]],["新同事第一天","💼 职场场景 · 进阶",[["同事","Hi there! You must be the new colleague. I'm Sarah from the marketing team.","你好！你一定是新来的同事吧。我是市场部的莎拉。"],["你","Nice to meet you, Sarah! I'm Amy. Today is my first day as a graphic designer.","很高兴认识你，莎拉！我是艾米。今天是我做平面设计师的第一天。"],["同事","Welcome aboard, Amy! How was your first commute to the office? Did you find it okay?","欢迎加入，艾米！第一次来上班路上顺利吗？"],["你","It went pretty smoothly, thank you. The subway takes about forty minutes, which isn't bad at all.","挺顺利的，谢谢。地铁大概要四十分钟，还算不错。"],["同事","That's not bad for this city! Let me show you around. Our department is on the third floor, next to the design studio.","在这座城市算不错啦！我带你转转。我们部门在三楼，设计工作室旁边。"],["你","Great! Where should I sit? Is there a fixed spot for me?","太好了！我坐哪里？有固定工位吗？"],["同事","You have a desk by the window — the one with the new monitor. Team members usually sit together in this open area.","你有一个靠窗的工位——带新显示器的那张。团队成员一般都坐在这个开放区域。"],["你","That view is amazing! I really lucked out with that spot.","这景色太棒了！我这工位真是抽到好签了。"],["同事","Haha, we'll see how much work you get done with that distraction! Do you have your laptop and access card yet?","哈哈，看这诱惑之下你能干多少活吧！笔记本电脑和门禁卡都拿到了吗？"],["你","Yes, I picked them up from HR this morning. I still need to set up my email and passwords, though.","拿到了，今天早上从人事那里领的。不过邮箱和密码还没设置好。"],["同事","No worries — IT can help you with that. Just submit a ticket on the company portal, and they usually respond within an hour.","别担心——IT 部门可以帮忙。在公司门户上提交一个工单就行，他们通常一小时内响应。"],["你","Perfect. What does a typical day look like here? I want to get into a good rhythm.","太好了。这里平常的一天是什么样的？我想尽快进入状态。"],["同事","We have a quick team meeting every morning at nine thirty. After that, most people focus on their projects until lunch.","我们每天早上九点半有个简短的团队例会。之后大家各忙各的项目，一直到午饭。"],["你","Where do people usually go for lunch? Any recommendations nearby?","大家一般去哪儿吃午饭？附近有什么推荐吗？"],["同事","There's a great noodle place two blocks away, and the food court in the basement is super convenient. A few of us usually eat together around twelve.","两个街区外有家很棒的面馆，地下层的美食广场也特别方便。我们几个人通常十二点左右一起吃。"],["你","I'd love to join you guys! It's a nice way to get to know everyone.","我很想跟你们一起吃！这是认识大家的好机会。"],["同事","You're welcome to! So, Amy, tell me a little about yourself. What did you do before joining us?","随时欢迎！对了艾米，介绍一下你自己吧。来我们这儿之前是做什么的？"],["你","I worked at a small agency for three years, mostly on branding projects. I wanted to try something bigger, so here I am.","我在一家小设计公司做了三年，主要做品牌项目。想试试更大的平台，所以就来了。"],["同事","That background will be super useful here. We're launching a new campaign next month, and we definitely need fresh ideas.","这背景在这儿肯定大有用武之地。我们下个月要启动一个新营销活动，正需要新鲜创意。"],["你","I'd be happy to contribute! Just let me know how I can help.","我很乐意出力！需要我做什么尽管说。"],["同事","I'll send you the project files this afternoon. Oh, and one more thing — every Friday we have a casual get-together at four.","今天下午我把项目文件发给你。哦对了，还有一件事——每周五下午四点我们有个轻松的小聚会。"],["你","That sounds fun! I look forward to it. Thanks for making my first day so easy, Sarah.","听起来很有意思！我很期待。谢谢你让我第一天过得这么顺利，莎拉。"],["同事","Anytime! We're all glad to have you here. Just shout if you need anything.","随时效劳！大家都很高兴你加入。有任何需要尽管喊我。"]]],["看医生","🏥 生活场景 · 进阶",[["医生","Good afternoon. Come in and have a seat. What brings you in today?","下午好，进来坐吧。今天哪里不舒服？"],["你","Good afternoon, doctor. I've been having a really bad headache for the past three days.","下午好，医生。我这三天头疼得厉害。"],["医生","I see. Can you describe the pain? Is it sharp, dull, or more like a pressure?","明白了。能描述一下疼痛吗？是刺痛、闷痛，还是像有压力的那种？"],["你","It's mostly a dull pain around my forehead, but sometimes it feels like someone is squeezing my head.","主要是额头周围的闷痛，但有时感觉像有人在挤压我的头。"],["医生","On a scale of one to ten, how bad is the pain when it's at its worst?","按一到十分打分，最疼的时候有多疼？"],["你","Probably a seven. It gets worse in the afternoon, especially after I look at screens for a long time.","大概七分。下午会加重，尤其是长时间看屏幕之后。"],["医生","How many hours do you spend on screens each day, would you say?","你每天看屏幕大约有几个小时？"],["你","Honestly, around ten hours. I work in front of a computer, and I use my phone a lot at night.","说实话，十个小时左右。我上班对着电脑，晚上还老玩手机。"],["医生","That could definitely be a factor. Have you been sleeping well recently?","这很可能是个诱因。最近睡眠怎么样？"],["你","Not really. I've been falling asleep after midnight and waking up several times during the night.","不太好。总是半夜以后才睡着，夜里还会醒好几次。"],["医生","Any other symptoms — nausea, blurred vision, or sensitivity to light?","还有其他症状吗——恶心、视线模糊，或者怕光？"],["你","My eyes feel dry and tired, but no nausea or blurred vision that I've noticed.","眼睛又干又累，不过没觉得恶心，视线也不模糊。"],["医生","Let me check your blood pressure... It's slightly high, but nothing alarming. Now look at the light and follow my finger.","我量一下你的血压……稍微偏高，但不用紧张。现在看着灯光，跟着我的手指看。"],["你","Sure. Is it anything serious, doctor? I'm a little worried.","好的。医生，严重吗？我有点担心。"],["医生","No need to worry. Based on everything you've told me, this looks like a tension headache, most likely caused by eye strain and poor sleep.","不用担担心。根据你说的这些，应该是紧张性头痛，很可能是用眼过度加上睡眠不好引起的。"],["你","That's a relief. What should I do to make it better?","那就放心了。我该怎么改善呢？"],["医生","First, follow the twenty-twenty-twenty rule — every twenty minutes, look at something twenty feet away for twenty seconds.","首先，遵循「二十二十二十法则」——每看屏幕二十分钟，就望向六米外的地方二十秒。"],["你","Twenty minutes, twenty feet, twenty seconds. Got it. Anything else I should do?","二十分钟、六米、二十秒。记住了。还有别的要注意的吗？"],["医生","Try to cut screen time after ten at night, and drink more water during the day. I'll also prescribe some painkillers just in case.","尽量晚上十点后少看屏幕，白天多喝水。我再给你开点止痛药备着。"],["你","How should I take the medicine?","这药怎么吃？"],["医生","Take one tablet only when the pain is unbearable, and never more than three tablets a day.","只在疼得受不了时吃一片，一天最多不超过三片。"],["你","Understood. Should I come back for a follow-up?","明白了。需要来复诊吗？"],["医生","If the headache continues after a week, come back and we'll do a thorough check-up. But I expect you'll feel much better soon.","如果一周后还疼，就回来做个全面检查。不过我预计你很快就会好起来的。"],["你","Thank you so much, doctor. I feel much more relaxed now.","太感谢您了，医生。我现在感觉轻松多了。"]]],["机场值机","✈️ 旅行场景 · 进阶",[["地勤","Good evening! May I see your passport and ticket, please?","晚上好！请出示您的护照和机票。"],["你","Sure, here you go. I'm flying to Los Angeles tonight.","好的，给您。我今晚飞洛杉矶。"],["地勤","Thank you. Let me check... Yes, Flight AA 288, departing at ten forty-five. Are you checking any bags today?","谢谢，我查一下……是的，AA 288 航班，十点四十五分起飞。您今天有行李要托运吗？"],["你","Yes, just this one suitcase. Is it within the weight limit?","有，就这一个行李箱。没超重吧？"],["地勤","Let me put it on the scale... It's twenty-three kilograms. The limit is twenty-three, so you're right at the line — no extra charge.","我放到秤上称一下……二十三公斤。限额正好是二十三，您刚好压线——不用补费用。"],["你","What a relief! I was worried it might be overweight.","太好了！我还担心超重呢。"],["地勤","You're all set with that. Would you prefer a window or an aisle seat?","行李没问题了。您想要靠窗还是靠过道的座位？"],["你","A window seat, please. I like looking at the clouds during takeoff and landing.","要靠窗的。我喜欢在起降的时候看云。"],["地勤","Nice choice. I can offer you 32A by the window. It's over the wing, so the flight tends to be more stable there.","好选择。32A 靠窗，就在机翼上方，飞行通常会更平稳。"],["你","That sounds perfect. Is the flight full tonight?","听起来很完美。今晚航班满员吗？"],["地勤","It's about eighty percent full. Boarding starts at ten o'clock at Gate B12, and boarding groups are printed on your boarding pass.","大约八成满。十点开始登机，登机口是 B12，登机组别印在您的登机牌上。"],["你","How long does it take to get to Gate B12 from here?","从这儿到 B12 登机口要走多久？"],["地勤","About fifteen minutes on foot, or you can take the shuttle train. Either way, you have plenty of time.","步行大约十五分钟，也可以坐摆渡列车。怎么走您时间都很充裕。"],["你","Great. One more question — is dinner served on this flight?","好的。再问一下——航班上提供晚餐吗？"],["地勤","Yes, we'll serve dinner about an hour after takeoff, and there's a light breakfast before landing. Special meals can be ordered in advance.","提供的，起飞后一小时左右供应晚餐，落地前还有轻早餐。特殊餐食可以提前预订。"],["你","Good to know. Where do I go through security? Is it this way?","了解了。安检往哪儿走？是这边吗？"],["地勤","Yes, security is straight ahead after the duty-free shops. Have your boarding pass and ID ready — you'll need them twice.","是的，过了免税店一直往前就是安检。请备好登机牌和证件——要出示两次。"],["你","Got it. Is the Wi-Fi free in the waiting area?","明白了。候机区的 Wi-Fi 是免费的吗？"],["地勤","The airport offers one hour of free Wi-Fi — just connect to the airport network and follow the sign-in steps.","机场提供一小时免费 Wi-Fi——连接机场网络，按提示登录就行。"],["你","Perfect. And could you point me to a water fountain? I want to fill my bottle before boarding.","太好了。能指一下饮水机在哪儿吗？登机前我想把水杯灌满。"],["地勤","Of course. There's one right past security on your left, next to the restrooms.","当然。过了安检左手边就有一个，在洗手间旁边。"],["你","You've been very helpful. Thank you so much, and have a good flight—oh wait, that's my line!","你帮了大忙，非常感谢，祝你飞行愉快——哦不对，这句话该我说！"],["地勤","Haha, thank you! Have a wonderful trip to Los Angeles, and enjoy your window seat!","哈哈，谢谢！祝您洛杉矶之行愉快，好好享受您的靠窗座位！"]]],["餐厅预订","🍽️ 生活场景 · 基础",[["你","Hello, I'd like to make a reservation for two this Friday at seven thirty.","你好，我想预订这周五晚上七点半，两位。"],["服务员","Sure! May I have your name and a contact number, please?","没问题！请问您的姓名和联系电话？"],["你","It's Chen Wei, and my number is one three eight, double seven, two three four five.","我叫陈伟，电话是一三八、七七、二三四五。"],["服务员","Got it, Mr. Chen. Would you prefer a window seat or by the window-side booth?","好的，陈先生。您想坐靠窗的位置，还是窗边卡座？"],["你","A quiet booth would be lovely, if possible — we're celebrating an anniversary.","如果可以的话，安静的卡座最好，我们在庆祝纪念日。"],["服务员","Congratulations! I'll note that down. Shall I prepare a small dessert with a candle?","恭喜！我记下来。需要准备一份带蜡烛的小甜点吗？"],["你","That would be perfect, thank you. Do you have a vegetarian option on the set menu?","那就太好了，谢谢。套餐里有素食选择吗？"],["服务员","Yes, our chef's vegetarian tasting is very popular. I'll add it for one guest.","有的，主厨素食拼盘很受欢迎。我给其中一位客人加上。"],["你","Wonderful. And is there a dress code?","太好了。请问有着装要求吗？"],["服务员","Smart casual is fine. We'll see you on Friday at half past seven!","商务休闲即可。周五七点半见！"]]],["医院挂号就诊","🏥 生活场景 · 实用",[["前台","Good morning. How can I help you today?","早上好。请问今天有什么可以帮您？"],["你","Morning. I'd like to register for an appointment with a general practitioner.","早上好。我想挂号看全科医生。"],["前台","Do you have your ID card and medical insurance card with you?","您带身份证和医保卡了吗？"],["你","Yes, here they are. I've had a sore throat and a mild fever since yesterday.","带了，给您。我从昨天起嗓子疼，还有点低烧。"],["前台","I'm sorry to hear that. Let me check the schedule — Dr. Lin has an opening at ten forty.","听到您不舒服我很遗憾。我查一下排班——林医生十点四十有空档。"],["你","Ten forty works. Should I wait here or go to the waiting room?","十点四十可以。我是在这儿等还是去候诊区？"],["前台","Please take a seat in the waiting room. We'll call your name on the screen.","请在候诊区就坐，我们会在屏幕上叫您的名字。"],["你","Thank you. Is there a pharmacy on the first floor for the prescription later?","谢谢。待会儿拿处方，一楼有药房吗？"],["前台","Yes, the pharmacy is just next to the elevators on this floor.","有的，药房就在这层电梯旁边。"],["你","Great, thanks for your help.","太好了，谢谢你。"]]],["超市购物结账","🛒 生活场景 · 基础",[["你","Hi, where can I find the self-checkout machines?","你好，自助结账机在哪儿？"],["店员","They're at the front, on the right side near the entrance. Are you a member?","在前门右侧入口附近。您是会员吗？"],["你","Yes, I scanned my app when I walked in. Do I need a basket for these?","是的，我进来时扫了 App。这些需要用购物篮吗？"],["店员","For just a few items, you can use the small tray. Let me show you.","东西不多的话用这个小托盘就行。我带您去。"],["你","Thanks. How do I weigh the vegetables here?","谢谢。这里的蔬菜怎么称重？"],["店员","Tap the item on screen, place it on the scale, and the price prints automatically.","在屏幕上点选商品，放到秤上，价格会自动打印。"],["你","Oh, that's easy. What if the barcode won't scan?","哦，挺简单的。要是条码扫不上怎么办？"],["店员","Press 'lookup' and type the code below the item. A colleague can also help.","按「查找」输入商品下方编码，同事也会来帮忙。"],["你","Got it. Can I pay with my phone?","明白了。能用手机支付吗？"],["店员","Absolutely — tap the phone reader at the bottom right. Have a nice day!","当然，在右下方手机感应区刷一下就好。祝您愉快！"]]],["朋友聚会闲聊","💬 社交场景 · 轻松",[["朋友","Hey! You made it. I saved you a seat by the window.","嘿！你来了。我在窗边给你留了位子。"],["你","Thanks! This place looks cozy. How's everyone been?","谢谢！这地方挺温馨的。大家都还好吗？"],["朋友","Pretty good. Mia just got promoted, and Leo started his own studio.","都不错。 Mia 刚升职，Leo 开了自己的工作室。"],["你","Wow, big news! Leo, tell me about the studio — what kind of work do you take?","哇，大新闻！Leo，跟我说说工作室，你们接什么活儿？"],["朋友","Mostly branding and short videos for small cafés. It's been busy but fun.","主要是给小咖啡馆做品牌和短视频。忙但开心。"],["你","That sounds right up your alley. Are you hiring at all?","那正合你专长。有在招人吗？"],["朋友","Maybe one intern next month. Why, interested?","下个月可能招个实习生。怎么，感兴趣？"],["你","My cousin's looking — she's great with editing. I'll connect you two.","我表妹在找，她剪辑很厉害。我介绍你们认识。"],["朋友","Perfect. Send me her portfolio and we'll chat.","太好了。把作品集发我，我们聊聊。"],["你","Will do. Cheers to a great evening, everyone!","一定。为大家美好的夜晚干杯！"]]],["酒店入住办理","🏨 生活场景 · 实用",[["前台","Good evening, welcome to Lakeside Hotel. Do you have a reservation?","晚上好，欢迎来到湖畔酒店。您有预订吗？"],["你","Yes, under the name Zhang. We booked a lake-view double for three nights.","有，张姓预订的。我们订了三晚湖景大床房。"],["前台","Let me pull that up... Yes, room 608, lake view, with breakfast included.","我查一下……是的，608 房，湖景，含早餐。"],["你","Great. Is it possible to have a late checkout on the last day?","太好了。最后一天可以晚点退房吗？"],["前台","Certainly, until two p.m. at no extra charge. May I see your passport?","当然，下午两点前免费。能看一下您的护照吗？"],["你","Here you go. Also, is there a gym or pool we can use?","给您。另外，有健身房或泳池可以用吗？"],["前台","Both on the third floor, open from six a.m. to ten p.m. Here's your key card.","三楼都有，早六点到晚十点。这是您的房卡。"],["你","Thank you. How do we get to the restaurant for breakfast?","谢谢。早餐餐厅怎么走？"],["前台","Second floor, turn left out of the lift. Enjoy your stay!","二楼，出电梯左转。祝您入住愉快！"],["你","We will. Thanks so much!","我们会的。多谢！"]]],["面试自我介绍","💼 职场场景 · 进阶",[["面试官","Thanks for coming in. Could you start with a brief introduction?","感谢您来面试。先做个简短的自我介绍吧。"],["你","Of course. I'm Li Na, a marketing specialist with four years of experience in consumer brands.","好的。我是李娜，有四年的消费品牌市场经验。"],["面试官","What drew you to our company specifically?","您为什么特别想来我们公司？"],["你","I admire how you blend data with storytelling — your last campaign was genuinely memorable.","我很欣赏你们把数据和叙事结合的方式，上次的活动令人印象深刻。"],["面试官","Tell me about a project you're proud of.","说一个您引以为豪的项目吧。"],["你","I led a relaunch that lifted repeat purchase by twenty-three percent in one quarter.","我主导过一次重启，一个季度内复购率提升了百分之二十三。"],["面试官","How do you handle disagreement with a manager?","和经理意见不合时您怎么处理？"],["你","I focus on the shared goal, bring data, and propose a small test to let results decide.","我会聚焦共同目标，拿出数据，提议小范围测试让结果说话。"],["面试官","Good approach. Any questions for me?","思路不错。您有什么想问我的吗？"],["你","Yes — how does this team measure success in the first six months?","有——这个团队如何衡量入职前半年的成功？"]]],["电话订外卖","📞 生活场景 · 基础",[["你","Hi, I'd like to order a delivery — a medium pepperoni pizza and a garden salad.","你好，我想点外卖——一个中号辣肠披萨和一个田园沙拉。"],["客服","Sure! May I have your address and phone number, please?","好的！请告诉我您的地址和电话。"],["你","It's apartment seven, building three, Rose Garden, and my number is one three nine...","玫瑰花园三栋七单元，电话是一三九……"],["客服","Got it. Any toppings to add or remove?","收到。要加料或去料吗？"],["你","Please add extra cheese, and no onions on the salad.","加双份芝士，沙拉不要洋葱。"],["客服","Noted. Would you like a drink with that?","记下了。要配饮料吗？"],["你","A bottle of sparkling water, please.","一瓶气泡水，谢谢。"],["客服","Your total is sixty-eight yuan. It'll arrive in about thirty-five minutes.","一共六十八元，大约三十五分钟送到。"],["你","Perfect. Can I pay on arrival?","太好了。可以货到付款吗？"],["客服","Yes, cash or scan on delivery. Thank you!","可以，收货时现金或扫码都行。谢谢！"]]],["书店找书请教","📚 生活场景 · 基础",[["店员","Can I help you find something?","需要帮您找什么书吗？"],["你","Yes, I'm looking for a beginner book on personal finance, something practical.","我想找一本个人理财入门书，实用一点的。"],["店员","Follow me — the money section is the second shelf on your left.","跟我来——理财区在您左边第二个书架。"],["你","These covers all look intimidating. Any you'd recommend for a total beginner?","这些封面看着都好吓人。有推荐给纯新手的吗？"],["店员","This one explains things through stories, very approachable.","这本用故事讲概念，很好懂。"],["你","I like that. Does it cover budgeting and investing basics?","我喜欢这种。它涵盖预算和入门投资吗？"],["店员","Both, plus a chapter on avoiding common mistakes.","都涵盖，还有一章讲如何避开常见误区。"],["你","Great, I'll take it. Do you gift-wrap?","太好了，就要这本。可以包装成礼物吗？"],["店员","Sure, ten yuan for wrapping. Anything else?","可以，包装十元。还要别的吗？"],["你","No, that's all. Thank you for the help!","不用了。谢谢你的帮助！"]]],["健身教练沟通","🏋️ 生活场景 · 实用",[["教练","Hey! Ready for today's session? Any aches from last time?","嘿！今天准备好了吗？上次有哪里酸痛吗？"],["你","A bit sore in my lower back, but nothing sharp. Let's go easy today.","下背有点酸，但不刺痛。今天轻松点吧。"],["教练","Smart. We'll focus on mobility and light weights. Grab a mat.","明智。今天练活动度和轻重量。拿个垫子。"],["你","Should I warm up with the bike or just stretch?","热身用自行车还是直接拉伸？"],["教练","Five minutes on the bike, then dynamic stretches. Listen to your body.","自行车五分钟，再动态拉伸。听身体的。"],["你","Got it. How many sets of the row today?","明白。今天划船机做几组？"],["教练","Three sets of twelve, controlled and slow. Quality over speed.","三组十二次，慢而稳。质量重于速度。"],["你","Noted. And the protein — when should I take it?","记下了。蛋白粉什么时候喝？"],["教练","Within thirty minutes after we finish. I'll mix one for you.","练完三十分钟内。我给你冲一杯。"],["你","Appreciate it. Let's get started!","谢了。开始吧！"]]],["问路指路","🗺️ 生活场景 · 基础",[["路人","Excuse me, could you tell me how to get to the subway station?","打扰一下，地铁站怎么走？"],["你","Sure! Go straight two blocks, then turn left at the bakery.","可以！直走两个街区，在面包店左转。"],["路人","Left at the bakery — got it. Is it far from there?","面包店左转，记住了。那之后远吗？"],["你","About a five-minute walk. You'll see the entrance on your right.","走大约五分钟。入口在您右手边。"],["路人","Perfect. And is there a ticket machine inside?","太好了。里面有用购票机吗？"],["你","Yes, several near the gate. They take cards and phone pay.","有，闸机旁好几台。支持刷卡和手机支付。"],["路人","Wonderful, thanks so much for your help!","太好了，多谢你帮忙！"],["你","No problem — enjoy your trip!","不客气，旅途愉快！"]]],["理发店沟通","💇 生活场景 · 基础",[["发型师","What are we thinking for today?","今天想怎么弄？"],["你","Just a trim — keep the length, clean up the ends.","修一下就好，保留长度，修齐发尾。"],["发型师","Sure. Any change to the layers?","好的。层次要调整吗？"],["你","A little lighter around the face, but nothing dramatic.","脸颊两侧打薄一点，别太夸张。"],["发型师","Got it. How do you usually style it?","明白。您平时怎么打理？"],["你","I mostly air-dry and tuck it behind my ear.","我多半自然风干，别到耳后。"],["发型师","Then I'll keep the sides easy to manage. Wash first?","那两侧我修得容易打理。先洗吗？"],["你","Yes, please. Not too much product after.","好的。之后别用太多造型品。"],["发型师","Of course. Twenty minutes and you're set.","当然。二十分钟就好。"]]],["银行开户咨询","🏦 职场/生活 · 实用",[["柜员","Welcome. What can I do for you today?","欢迎。今天能为您办什么？"],["你","I'd like to open a savings account, preferably with an app.","我想开个储蓄账户，最好有 App。"],["柜员","Great choice. Do you have your ID and proof of address?","好选择。带身份证和住址证明了吗？"],["你","Yes, both here. Is there a monthly fee?","都带了。有月费吗？"],["柜员","No fee for the basic account, and the app is free to use.","基础账户无月费，App 免费。"],["你","Perfect. Can I link it to my phone for transfers?","太好了。能绑定手机转账吗？"],["柜员","Absolutely — I'll activate mobile banking now.","当然，我现在帮您开通手机银行。"],["你","How long until the card arrives?","卡多久能到？"],["柜员","About a week by mail. You can use the app right away.","邮寄约一周。App 立即可用。"],["你","Wonderful, thank you!","太好了，谢谢！"]]],["参加婚礼致辞","💍 社交场景 · 进阶",[["你","Good evening, everyone. For those who don't know me, I'm the bride's cousin.","大家晚上好。不认识我的朋友，我是新娘的表姐。"],["你","I've known Mia since we were kids building forts out of sofa cushions.","我从小认识 Mia，那时我们用沙发垫搭堡垒。"],["你","She's the most loyal person I know — the one who remembers your coffee order.","她是我认识最忠诚的人，连你喝咖啡的偏好都记得。"],["你","And David, welcome to the family. We're lucky to gain such a calm, kind man.","David，欢迎加入这个家。我们很幸运多了你这样温和善良的人。"],["你","So let's raise a glass — to love that's steady, and a life that's kind.","让我们举杯——敬恒久的爱，敬温柔的一生。"]]],["客户电话沟通","💼 职场场景 · 进阶",[["客户","Hi, this is Mr. Tan from Bright Co. I'm calling about our last order.","您好，我是明公司的谭先生。想问下我们上次那批订单。"],["你","Hello Mr. Tan, good to hear from you. What can I help with?","谭先生您好，很高兴接到您电话。有什么可以帮您？"],["客户","The shipment arrived, but two boxes were damaged. Can we get a replacement?","货到了，但有两箱破损。能补发吗？"],["你","I'm sorry about that. Could you send photos of the damage, please?","很抱歉。能发一下破损照片吗？"],["客户","Sure, I'll email them now. How long for the new boxes?","可以，我马上发邮件。补发的箱子要多久？"],["你","We'll ship within two business days, free of charge. I'll follow up by email.","我们两个工作日内发出，免费。我会邮件跟进。"],["客户","Appreciate the quick response. And the invoice?","感谢快速回复。发票呢？"],["你","I'll resend the invoice today with the replacement note attached.","今天重发发票，附上补发说明。"],["客户","Great. Talk soon, and thanks.","好。回头聊，谢谢。"],["你","Thank you, Mr. Tan. Have a good day!","谢谢谭先生。祝您愉快！"]]],["机场值机沟通","✈️ 生活场景 · 进阶",[["你","Good morning. I'd like to check in for flight CA983 to London, please.","早上好，我想办理飞伦敦的 CA983 航班值机。"],["柜台","Of course. May I see your passport and booking confirmation?","好的，请出示您的护照和订单确认单。"],["你","Here you go. I booked through an online travel agency last week.","给您。我上周通过在线旅行社订的。"],["柜台","Got it. You're in seat 23A, economy class. Would you prefer a window or aisle seat?","好的，您在 23A 经济舱。您想要靠窗还是靠走道？"],["你","Aisle seat, please. I tend to get up to stretch during long flights.","请给我靠走道。我长途飞行时喜欢起身活动。"],["柜台","No problem. Let me check the availability... I have 24C available, an aisle seat with extra legroom. It's an additional thirty dollars.","没问题。让我查一下……24C 还有，是靠走道带额外腿部空间，需要加三十美元。"],["你","That sounds worth it. I'll take it.","听起来值。就要那个吧。"],["柜台","Perfect. How many checked bags do you have today?","完美。今天有几件托运行李？"],["你","Just one suitcase. It's twenty-three kilograms — I weighed it at home.","就一件行李箱，二十三公斤——我在家称过了。"],["柜台","Under the twenty-three-kilo limit, no overweight fee. Does it contain any lithium batteries or liquids over one hundred milliliters?","没超过二十三公斤限重，没有超重费。里面有没有锂电池或超过一百毫升的液体？"],["你","No, only clothes and a few books. The liquids are in my carry-on as required.","没有，只有衣服和几本书。液体按规定放在手提行李里了。"],["柜台","Great. Please place your suitcase on the belt. While I tag it, let me ask about your return flight.","好的，请把箱子放上传送带。我贴标签时，问一下您的回程航班。"],["你","I have a return flight on the 18th of next month, also to Beijing.","我订了下个月 18 号的返程航班，也是回北京。"],["柜台","Got it. We can confirm that on the system. Now, do you need any special assistance on board?","好的，我们在系统里确认一下。机上有任何特殊协助需求吗？"],["你","No, I'm fine. Just the aisle seat is enough. Oh, and a vegetarian meal if that's available.","没有，我挺好的。靠走道就够了。如果有的话，给我一份素食餐。"],["柜台","Vegetarian meal noted. Are you a member of our frequent flyer program?","已记录素食餐。您是我们常旅客计划的会员吗？"],["你","Yes, my number is on the boarding pass from last time. Let me find it on my phone.","是的，上次的登机牌上有。让我手机上找一下。"],["柜台","No rush. I can look you up by name or passport.","不急。我可以通过姓名或护照查找您。"],["你","Try my name — Chen Lily, with a C.","试试我的名字——陈莉莉，C 开头。"],["柜台","Found you. You're Gold tier, which gives you priority boarding and an extra checked bag free of charge.","找到了。您是金卡会员，可以优先登机，并免费托运一件额外行李。"],["你","Great, that's actually useful since I'm bringing gifts back home.","太好了，我正打算带礼物回国，这正好用得上。"],["柜台","Excellent. Here's your boarding pass — gate B17, boarding starts at 9:40, and the door closes at 10:00 sharp. Please arrive at the gate no later than 9:30.","完美。这是您的登机牌——B17 登机口，9:40 开始登机，10:00 准时关门。请不晚于 9:30 到达登机口。"],["你","B17, noted. What time does the flight depart?","B17，记下了。航班几点起飞？"],["柜台","10:30. It's about an eleven-hour flight to London, with a six-hour time difference.","10:30。飞伦敦约 11 小时，有六小时时差。"],["你","So I'll arrive around 4:30 PM local time?","那我大概当地时间下午 4:30 抵达？"],["柜台","Yes, around 4:40 PM. Make sure you get plenty of rest on the plane, and I hope you enjoy your trip.","是的，大约下午 4:40。请在飞机上充分休息，祝您旅途愉快。"],["你","Thank you. One last question — is the lounge accessible for Gold members in Beijing?","谢谢。最后一个问题——金卡会员在北京可以使用贵宾休息室吗？"],["柜台","Absolutely. The Air China lounge is on the third floor after security, opens at 6 AM.","当然可以。国航贵宾休息室在安检后三楼，早上 6 点开始。"],["你","Perfect. Is there Wi-Fi inside the lounge?","完美。休息室里有 Wi-Fi 吗？"],["柜台","Yes, complimentary high-speed Wi-Fi for all lounge guests, plus showers, hot meals, and a quiet area.","有的，所有休息室客人都可享用免费高速 Wi-Fi，还有淋浴、热餐和安静区。"],["你","Sounds amazing. I'll be there early then. Thanks so much for your help!","听起来棒极了，那我早点过去。非常感谢你的帮助！"],["柜台","My pleasure, Ms. Chen. Have a wonderful flight and a great trip to London.","不客气，陈女士。祝您飞行愉快，伦敦之行顺利。"],["你","Thanks, you too. Take care!","谢谢，你也是，保重！"]]],["年度绩效面谈","💼 职场场景 · 进阶",[["经理","Thanks for coming in, Daniel. Let's talk about your performance this quarter.","丹尼尔，谢谢你过来。我们来聊聊你这个季度的表现。"],["你","Sure. I've been looking forward to this conversation. How do you feel I did overall?","好的，我一直很期待这次谈话。您觉得我整体做得怎么样？"],["经理","Overall, very strong. You hit every project deadline and the client satisfaction scores are up twenty percent.","整体非常出色。你每个项目都按期交付，客户满意度上涨了 20%。"],["你","I'm glad to hear that. I worked especially hard on the Anderson account.","很高兴听到这个。我在 Anderson 那个客户身上花了特别多精力。"],["经理","It shows. The way you handled the scope creep on that project was textbook. Anything you'd like to call out?","看得出。你处理那个项目范围蔓延的方式堪称典范。有没有你想特别提的事？"],["你","Honestly, I think I could have delegated more. I held onto too many small tasks myself, which led to a few late evenings.","老实说，我觉得我可以更早一些委派工作。有些小任务我揽在自己身上，导致加班了几次。"],["经理","That's a fair self-assessment. What would you do differently next time?","这是个公平的自我评价。下次你会怎么调整？"],["你","I'd bring my team in earlier for the kickoff and assign owners from day one.","我会在项目启动时就拉团队进来，第一天就明确每个模块的负责人。"],["经理","I like that approach. Let's build it into your goals for next quarter. Speaking of which, what's your biggest priority?","我喜欢这个做法。我们把它写进你下季度的目标吧。说到这个，你最大的优先事项是什么？"],["你","I'd like to lead the new product launch end-to-end. I've been supporting launches for two years; I think I'm ready to drive one.","我想从头到尾主导一次新品发布。我支持过两次发布，我觉得我已经准备好了。"],["经理","You've definitely earned that opportunity. I'd like to put you on the autumn launch as project lead.","你绝对配得上这个机会。我打算让你做秋季发布会的项目负责人。"],["你","That would be amazing. Thank you for the trust.","那太棒了。谢谢您的信任。"],["经理","Of course. With that scope comes accountability — you'll need to manage the budget too.","当然，但权责对等——你还需要管理预算。"],["你","Understood. I've been shadowing Janet on budget reviews to prepare for this.","明白。我一直跟着珍妮特学预算审核，就是为了这个。"],["经理","Good initiative. Now, on compensation — we're proposing a ten percent raise and a one-time bonus for the Anderson work.","很好，主动学。说到薪酬——我们提议涨薪 10%，并对 Anderson 项目发放一次性奖金。"],["你","I really appreciate that. The bonus means a lot, especially given the year we had.","非常感谢。奖金对我意义重大，特别是考虑到今年的情况。"],["经理","You earned every bit of it. The raise goes into effect next month.","你赚来的。下个月开始涨薪。"],["你","That's great timing. May I ask about the promotion path as well?","时机正好。请问晋升路径是怎样的？"],["经理","Absolutely. You're on track for senior next year if you continue at this pace. We have a formal review in Q3.","当然。按这个节奏，你明年有望升高级。第三季度会有正式评审。"],["你","Noted. I'll make sure my goals clearly align with that milestone.","明白。我会让我的目标明确对齐那个里程碑。"],["经理","One area I'd like to see growth is public speaking. We need more team members presenting at the industry conference.","有一个方面我希望看到成长：公开演讲。我们需要更多团队成员在行业会议上做报告。"],["你","That's my weakness, honestly. I'm fine in small groups but freeze on big stages.","说实话这是我短板。小场合没问题，但大舞台我会紧张到说不出话。"],["经理","We can fix that. The company sponsors a six-week public speaking course. I'll enroll you.","这可以改善。公司赞助一个为期六周的演讲课，我给你报名。"],["你","I'd really appreciate that. I'll commit to it fully.","非常感谢，我会全力投入。"],["经理","Good. Anything else you'd like to discuss today?","好的。今天还有别的想聊的吗？"],["你","Just one — how is the team morale? I want to make sure I'm doing my part as a peer.","就一件——团队士气怎么样？我想确保作为同事我也在出力。"],["经理","Honestly, it's been a tough quarter for everyone. People are stretched thin, but no one has raised a red flag.","老实说，这个季度大家都不容易。人人都绷得很紧，但没人亮红灯。"],["你","Would it help if I organized an informal lunch once a month? Just to give people a no-pressure space to vent.","如果我每月组织一次非正式午餐会有用吗？给大家一个无压力的吐槽空间。"],["经理","That's a great idea. I think people would really appreciate that. Run it for one quarter and we'll evaluate.","这是个好主意。我觉得大家会真心喜欢。试着做一个季度，我们再评估。"],["你","Sounds good. I'll set up a recurring invite and pick a rotating venue.","好。我会发循环邀请，挑个轮换的地点。"],["经理","Perfect. Thanks for being proactive on this, Daniel. You're a real asset to the team.","完美。谢谢你主动做这件事，丹尼尔。你是团队的真正财富。"],["你","Thank you, that means a lot. Looking forward to next quarter.","谢谢，这话对我很重要。我很期待下个季度。"],["经理","Me too. Keep up the great work. We'll talk again in three months.","我也是。继续出色表现。三个月后再聊。"],["你","Will do. Have a great rest of your day.","会的。祝你今天接下来一切顺利。"]]],["就医复诊沟通","🏥 生活场景 · 进阶",[["护士","Good morning, Ms. Wang. Dr. Liu will see you in about five minutes.","早上好，王女士。刘医生大约五分钟后为您看诊。"],["你","Thank you. I've been here since my last visit, and the medication seems to be helping.","谢谢。自上次就诊以来我一直在，药物似乎在起作用。"],["护士","Good to hear. How is your energy level these days?","很高兴听到。这段时间您的精力水平怎么样？"],["你","Better than before. I can climb two flights of stairs without getting out of breath, which I couldn't do a month ago.","比之前好了。我现在爬两层楼不会喘，一个月前不行。"],["护士","Excellent progress. Any side effects from the medication?","进展非常好。药物有副作用吗？"],["你","Mild dizziness the first few days, but it went away. Also, my sleep has been deeper.","前几天有轻微头晕，但后来消失了。而且我睡得更沉了。"],["护士","Both are normal during the adjustment period. Let me take your blood pressure before the doctor comes in.","调整期这两种都正常。医生来之前我先给您量个血压。"],["你","Sure. Should I sit or stand?","好的。我坐着还是站着？"],["护士","Sit comfortably with your arm on the table, like this. Try to relax.","舒适地坐着，手臂放在桌子上，像这样。尽量放松。"],["你","Like this?","这样吗？"],["护士","Perfect. Hold still for a moment... 122 over 78 — that's much better than your last reading.","完美。别动……122/78，比您上次好多了。"],["你","That's a relief. Last time it was higher.","松了口气。上次更高。"],["护士","Yes, you're responding well. The doctor will probably continue the same dose. Here's the chart, take a seat inside.","是的，您反应良好。医生可能继续同样剂量。这是病历表，请到里面坐。"],["你","Thanks. By the way, can I ask about the new dietary guidelines the doctor mentioned last time?","谢谢。顺便问一下，医生上次提到的新饮食建议我可以问吗？"],["护士","Of course. The doctor will cover it in detail. Anything urgent before she comes?","当然，医生会详细讲。她来之前有紧急的吗？"],["你","No rush. I'll wait inside.","不急，我里面等。"],["医生","Hi, Ms. Wang. Good to see you again. How are you feeling this month?","您好，王女士。很高兴又见面。这个月感觉怎么样？"],["你","Much better overall. The blood pressure seems under control, and I'm sleeping deeper.","整体好多了。血压似乎控制住了，而且睡得更沉。"],["医生","Great. The nurse's reading confirms it's coming down nicely. Are you keeping up with the walking routine?","很好。护士的测量确认在稳定下降。您还在坚持走路吗？"],["你","Every day, thirty minutes after dinner. Sometimes longer on weekends.","每天，晚饭后三十分钟。周末有时更久。"],["医生","That's perfect. Keep it consistent. How about the salt reduction — are you managing?","太好了，保持规律。减盐方面，做得怎么样？"],["你","It was hard at first, but I switched to low-sodium soy sauce and stopped adding salt at the table.","一开始很难，但我换成了低钠酱油，餐桌上不再加盐。"],["医生","Smart approach. Any chest discomfort or shortness of breath during exercise?","聪明的方法。运动时有胸闷或气短吗？"],["你","The first week I felt a tightness, but it's gone now. I think I just needed to build up gradually.","第一周有压迫感，但后来消失了。我想只是需要循序渐进。"],["医生","Exactly right. Don't push too hard. Now, I want to talk about the lab results from last week.","没错。别太拼。现在我想说一下上周的化验结果。"],["你","How do they look?","怎么样？"],["医生","Your cholesterol is still a touch high, but down from before. Your blood sugar is normal. Liver and kidney functions are great.","胆固醇还是有点偏高，但比之前下降了。血糖正常，肝肾功能很好。"],["你","Good to hear. Do I need to adjust anything for the cholesterol?","很高兴听到。胆固醇需要调整什么吗？"],["医生","Add more omega-3 — fish twice a week, walnuts daily. I'll keep you on the same medication for now and recheck in three months.","多吃 omega-3——每周两次鱼，每天吃点核桃。目前维持同样的药，三个月后复查。"],["你","Got it. Any other lifestyle changes you'd recommend?","明白了。还有什么生活方式调整建议吗？"],["医生","Yes — stress management. I noticed your heart rate was a bit elevated at rest. Are you sleeping enough?","是的——压力管理。我注意到您静息心率有点高。睡眠够吗？"],["你","Honestly, work has been intense. About six hours on weeknights.","老实说，工作压力大。工作日大概睡六小时。"],["医生","Six hours is on the low side. Aim for seven. It's as important as diet and exercise.","六小时偏少。目标七小时。这跟饮食和运动一样重要。"],["你","I'll make it a priority. Thanks for the reminder.","我会优先安排。谢谢提醒。"],["医生","Of course. You're doing really well overall. Just small refinements from here. Any other questions?","当然。您整体做得非常好。现在只是小的微调。还有其他问题吗？"],["你","Just one — is it okay to drink alcohol in moderation?","就一个——适量饮酒可以吗？"],["医生","Red wine is fine, one small glass a few times a week. Avoid heavy drinking — it raises blood pressure.","红酒可以，每周几次，每次一小杯。避免大量饮酒——会升血压。"],["你","Understood. I'll keep it to weekends only.","明白。我会只在周末喝。"],["医生","Great. See you in three months. Take care, Ms. Wang.","太好了。三个月后见。王女士，保重。"],["你","Thank you, doctor. Have a great day.","谢谢医生。祝你今天愉快。"]]],["旅游咨询规划","🧳 生活场景 · 进阶",[["你","Hi, I'd like to plan a week-long trip to Japan in October. Can you help me with the itinerary?","你好，我想规划十月份去日本一周的旅行。能帮我做行程吗？"],["顾问","Of course! October is a beautiful time — autumn leaves and pleasant weather. When in October are you thinking?","当然！十月很美——红叶和宜人天气。您想十月什么时候？"],["你","Probably the second week. I'd like to avoid the Japanese holiday crowds.","大概第二周。我想避开日本的节假日高峰。"],["顾问","Smart. Mid-October is ideal — crowds thin out after Golden Week is long over.","明智。十月中旬很理想——黄金周过了很久，人流已减少。"],["你","Perfect. I'd like to cover Tokyo, Kyoto, and maybe Osaka. First time in Japan.","太好了。我想覆盖东京、京都，可能还有大阪。第一次去日本。"],["顾问","Great choices. I'd suggest four nights Tokyo, two nights Kyoto, one night Osaka. Sound good?","都是好选择。我建议东京四晚，京都两晚，大阪一晚。可以吗？"],["你","Yes. I want to mix modern cities with traditional culture.","可以。我想把现代都市和传统文化结合。"],["顾问","Exactly right. Day one in Tokyo, I'll arrange airport pickup and a hotel in Shinjuku — very central.","对的。东京第一天，我安排机场接送和新宿的酒店——非常中心。"],["你","Shinjuku sounds great. Is breakfast included?","新宿听起来不错。含早餐吗？"],["顾问","Yes, Japanese and Western buffet. Plus the hotel has an onsen on the top floor.","是的，日式西式自助。酒店顶层还有温泉。"],["你","An onsen! That's a must-try for me.","温泉！那我一定要试试。"],["顾问","I'll book a traditional ryokan experience for one night in Kyoto too.","京都我也给您订一晚传统日式旅馆体验。"],["你","Wonderful. I've heard the hospitality in Kyoto is incredible.","太棒了。我听说京都的服务无与伦比。"],["顾问","It is. Kaiseki dinner, tatami floors, futon beds — the full experience.","是的。会席料理、榻榻米地面、被褥——完整体验。"],["你","Perfect. For transportation between cities, what's the best option?","太好了。城市间交通，最好的方式是什么？"],["顾问","The Japan Rail Pass for seven days. It covers the bullet train between all three cities, unlimited.","七日日本铁路通票。覆盖三市间的新干线，不限次数。"],["你","How fast is the bullet train?","新干线有多快？"],["顾问","Tokyo to Kyoto is about two hours and fifteen minutes. Kyoto to Osaka is only fifteen minutes.","东京到京都约两小时十五分钟。京都到大阪只要十五分钟。"],["你","Wow, that's incredibly efficient. I'll take the pass.","哇，效率惊人。我要通票。"],["顾问","I'll also arrange a Tokyo Metro pass for getting around the city. It's much cheaper than buying individual tickets.","我再给您安排东京地铁通票在城市内出行。比单买票便宜很多。"],["你","Smart. What are the must-see spots in Tokyo?","聪明。东京必看的地方是哪些？"],["顾问","Senso-ji Temple in Asakusa, the Meiji Shrine, Shibuya Crossing, and the Tsukiji outer market for fresh sushi.","浅草寺、明治神宫、涩谷十字路口、筑地外市场吃新鲜寿司。"],["你","Tsukiji — perfect. I love sushi.","筑地——完美。我爱寿司。"],["顾问","I'll arrange a guided food tour in Tsukiji on day three. Small group, English-speaking guide.","我安排第三天在筑地的美食导览团。小团，英语导游。"],["你","How many people in the group usually?","团一般多少人？"],["顾问","Max eight. Very personal, you get to meet locals.","最多八人。非常个性化，能遇到本地人。"],["你","Sounds great. What about in Kyoto?","听起来不错。京都呢？"],["顾问","Fushimi Inari shrine — the thousand torii gates. Walk up early to beat the crowds.","伏见稻荷大社——千本鸟居。早起爬上去避开人流。"],["你","I'll set an alarm for sunrise. How long is the climb?","我会定日出闹钟。爬多久？"],["顾问","To the top, about two hours round trip. Take your time, photograph as you go.","到顶上，往返约两小时。慢慢走，边走边拍。"],["你","Sounds magical. What's the best spot for autumn leaves?","听起来很梦幻。红叶最佳地点是？"],["顾问","Arashiyama Bamboo Grove in the morning, plus the nearby Togetsukyo Bridge. Both stunning in October.","早晨的岚山竹林，附近还有渡月桥。十月份两个都很惊艳。"],["你","I'll add both to the list. And Osaka?","我会都加上。大阪呢？"],["顾问","Osaka is famous for street food. Dotonbori district at night is the highlight. I'll book a street food walking tour.","大阪以街头小吃闻名。道顿堀夜景是亮点。我订一个街头美食步行团。"],["你","I'm sold. What's the budget for this trip?","我被说服了。这次旅行预算多少？"],["顾问","For a mid-range experience — flights, hotels, rail pass, tours, meals — about two thousand five hundred USD per person.","中端体验——机票、酒店、通票、团费、餐饮——每人约 2500 美元。"],["你","That's reasonable for a week in Japan. Let's go for it.","这个价格在一周的日本旅行里算合理。就这么定了。"],["顾问","Wonderful. I'll send you the detailed itinerary by tomorrow, and we can adjust anything you like.","太好了。明天我把详细行程发给您，您随时可以调整。"],["你","Sounds perfect. One last thing — do I need a visa?","听起来很完美。最后一件事——需要签证吗？"],["顾问","For most Western passports, no visa needed for stays under ninety days. Just a valid passport.","大多数西方护照，停留不超过 90 天不用签证。有效护照即可。"],["你","Easy. Thanks for all the help — I'm really excited.","简单。谢谢所有帮助——我真的很兴奋。"],["顾问","My pleasure. Japan in autumn is unforgettable. Have a wonderful trip.","不客气。秋天的日本令人难忘。旅途愉快。"],["你","Thank you. Talk soon.","谢谢。回头聊。"]]]];
const __DATA_EXPRESS__   = [["日常社交","给最好朋友的生日祝酒词","约 3 分钟",["亲爱的，今天是你二十五岁的生日，请允许我先举杯，敬过去的你，也敬未来的你。","认识你八年了。我还记得我们第一次见面的时候，你穿着一条洗得发白的牛仔裤，抱着一大摞书，在图书馆门口差点撞到我。谁能想到，这一撞，就撞出了这么多年的交情。","这八年里，我们一起熬过期末的通宵，一起在毕业那天哭得稀里哗啦，也一起在天台上看过凌晨四点的星星。我失恋的时候，是你陪我坐了一整晚；我找不到工作的时候，是你一遍遍帮我改简历、陪我练习面试。你总是说，朋友就是用来麻烦的。这句话，我一直记到今天。","新的一岁，我有三个愿望送给你。愿你眼里始终有光，不管世界怎么变，都能保持那份认真生活的热情；愿你心里始终有暖，遇到的人都真诚，走过的路都值得；愿你兜里始终有钱，想买的东西不用犹豫，想去的地方说走就走。","最后，愿你永远记得：无论你飞多高、走多远，回头看的时候，我一直都在。生日快乐，我最好的朋友。干杯！","对了,还要敬你身上那股「轴」劲儿。别人都说你倔,可我知道,那是你看准了就不撒手的认真。学游泳呛了多少次水,你愣是学会了;工作里吃了那么多闭门羹,你偏要一条路走通。这些年你教会我一件事:所谓厉害的人,不过是把别人放弃的那一步,多走了一遍。","当然,新的一岁也别太为难自己。累了就休息,委屈了就说出来,不用永远当那个报喜不报忧的懂事的人。我们之间,从来不需要体面,只需要真实。"]],["日常社交","一段走心的感谢","约 3 分钟",["想跟你说声谢谢，不是那种客套的谢谢，是想了很久、一定要当面说的那种。","这次的项目能顺利落地，你功不可没。说实话，中间有好几次我都想放弃了。数据对不上的时候，是你陪我一行一行地查到深夜；方案被推翻的时候，是你第一个站出来说\"再试一次，我觉得能行\"。你大概不知道，那句\"我觉得能行\"，在那个时刻对我有多重要。","我一直觉得，成年人的世界里，雪中送炭比锦上添花珍贵得多。你在我最狼狈的时候搭了把手，却从头到尾没提过一个\"谢\"字，好像那只是顺手的小事。可我心里清楚，没有人有义务对另一个人这么好。","这份人情我记下了。以后不管什么时候，只要你需要，一个电话我就到——帮忙搬家也好，深夜倾诉也好，或者只是想吃一顿热乎的饭，我随时奉陪。","所以，谢谢你。谢谢你专业上的托底，谢谢你情绪上的稳稳接住，也谢谢你让我相信，认真对一个人好，是一件值得的事。","其实我一直不太会表达感谢,总觉得说多了显得生分,不说又憋得慌。所以拖到今天,才把这段话完整地讲出来。你大概会笑我矫情,但请让我矫情这一次。","对了,还有一个小心愿:希望以后换我成为那个「被麻烦」的人。让你也能在撑不住的时候想起,有个朋友一直都在。这话不是客气,是认真的。江湖路远,来日方长,我们慢慢处。"]],["日常社交","安慰低谷期的朋友","约 3 分钟",["我知道，现在跟你说\"一切都会好起来的\"，你大概一个字都不想听。所以我不说这个，我就陪你坐一会儿。","先深呼吸，慢慢来。你不需要马上振作，也不需要立刻想通什么。难过就难过一会儿，这没什么不对的。允许自己有情绪，本身就是一种勇敢。","我想告诉你的是：这段时间的低谷，不是你的错。你已经很努力了，努力到我都看在眼里。有时候事情不顺利，真的只是运气还没到，或者时机不对，而不是你不够好。一次失败否定不了你这个人，它最多只能说明，这一件事、这一次，没成而已。","你愿意跟我说说吗？不用组织语言，想到哪儿说到哪儿，说乱了也没关系。要是暂时不想说，我们就安安静静待着，我陪你点个外卖、看个不用动脑子的综艺，也挺好。","记住，你不是一个人在扛。无论这件事最后怎么样，我都站在你这边。等你缓过来了，我们再一件一件地想办法；现在，先把自己照顾好——按时吃饭，能睡着就多睡一会儿。别的都不急，真的不急。","再给你讲个小秘密:我也曾在某个阶段觉得一切都完了,现在回头看,那段最难受的日子,反而成了我后来很多力量的来源。不是说苦难值得感谢——它不值得——而是走过它的人,会天然多出一层铠甲和柔软。你也会的。","手机别关机,我隔一会儿就给你发消息,不用急着回。饿了我们点你最爱吃的那家,困了就睡,想哭就哭。日子嘛,就是一天一天熬出来的,今天你只需要负责呼吸,别的交给时间。"]],["职场沟通","季度工作汇报","约 3 分钟",["各位领导、同事，大家好。下面由我汇报本季度的核心工作进展，预计占用三分钟，分三个部分：成果、问题、下季度计划。","先说成果。本季度我负责的用户增长项目整体完成度达到 112%，超出预期。具体拆开看：新增注册用户八万六千人，环比提升 34%；其中通过内容渠道带来的用户占比首次超过 40%，说明我们上季度调整的内容策略是有效的。另外，老用户三十日留存率从 22% 提升到了 27%，这五个百分点，主要归功于会员体系的改版。","再说问题。有两点需要坦诚汇报。第一，季度中段的推广活动 ROI 低于预期，投入产出比只有 1:1.4，复盘后我们发现是投放时段和目标人群错配，这个问题在八月已经修正；第二，客服响应时长有所上升，从平均 40 分钟涨到了 55 分钟，我们正在推进智能客服的接入，预计下季度能压回到 30 分钟以内。","最后是下季度计划。核心有三个字：稳、深、拓。稳住现有渠道的基本盘；深耕会员运营，目标是把留存再提升三个百分点；拓展两个新的获客渠道，目前已经完成了初步的商务接触。","以上是我的汇报，详细数据都在附件里，欢迎各位指正，谢谢大家。","关于团队的贡献,我也想多说两句:本季度的成果不是一个人的。增长策略的落地离不开产品组的快速响应,会员改版的设计资源是设计团队挤出时间支持的,数据看板的搭建要归功于数据组的小陈。这份成绩单属于整个协作链条上的每一个人。","风险提示方面还有一点补充:下季度如果新渠道拓展顺利,服务端压力会明显上升,建议提前和运维侧对齐扩容方案,避免重蹈本季度活动期间服务波动的覆辙。相关预估数据我已附在文档最后一页。"]],["职场沟通","会议上提出改进建议","约 3 分钟",["我想借这个机会，提一个不太成熟的想法，想听听大家的意见——关于我们的售后流程优化。","先说现象。我统计了最近三个月的客户反馈，发现大概每十条投诉里，有六条其实在抱怨同一件事：问题响应慢、流程来回跑。客户平均要在三个部门之间重复描述两遍以上的问题，体验很差。这背后反映的，是我们的售后流转机制还是按部门切分的，而不是按客户的问题类型切分的。","我的建议是做一个\"首问负责制\"的试点：客户的问题无论落到谁手上，第一个接待的人就负责跟进到底，内部流转由他来协调，而不是让客户自己追着各部门跑。为了控制风险，可以先在客单价最高的 VIP 客户群里试运行两周。","成本方面我初步算过：不需要增加人手，只需要调整工单系统的分配规则，加上一次两小时的跨部门对齐培训。如果试点数据好——比如响应时长缩短一半——再考虑全面推广。","这个想法肯定还有考虑不周的地方，特别想听听一线同事和各位领导的看法。如果方向可行，我愿意牵头先把试点方案细化出来。谢谢大家。","另外我想说明一下为什么是现在提这个事:一是刚做完客户反馈的季度盘点,数据是最新的,说服力最强;二是听说下个月系统要例行升级,工单模块本来就要动,改分配规则的边际成本是最低的。时机上,这可能是全年改造成本最小的一个窗口。","最后表个态:这件事不图快,先小步试点、用数据说话;如果试点证明不可行,我们及时止损,不会恋战。我就汇报到这里,麻烦大家了。"]],["职场沟通","得体地拒绝额外任务","约 3 分钟",["谢谢您的信任，把这么重要的任务交给我。说实话，这个项目我很感兴趣，也很想接下来。但今天找您，是想坦诚地跟您同步一下我目前的实际情况，请您帮我一起拿个主意。","我现在手上同时推进的有三件事：A 项目下周三交付，目前正处于联调的关键期，每天都需要盯进度；B 方案的客户评审定在周五，材料还有一半没完成；另外还有一项常规的月度结算，时间点是死的，不能顺延。这三件事加起来，我的排期已经满负荷了。","如果我硬把这个新任务接下来，我担心两个结果：一是新任务的质量达不到您的预期，二是把 A 项目的交付时间拖风险。这两个结果，无论哪个，都不是我们想看到的。","所以我想到三个备选方案，供您选择：第一，如果这个任务能推迟到下周一，我可以全身心投入，质量肯定有保障；第二，如果时间不能动，能否请小周来主责，我在需求和评审环节全力支持他；第三，如果必须由我来做，那 A 项目的交付时间是否可以协商往后压三天。","无论您选哪个方案，我都没有情绪，完全以大局为重。您看哪个更合适？","我知道,团队现在正是用人的时候,您也是掂量过才想到我,这份信任我领情,也很想接住。正因为想接住,我才更不能拍着胸脯硬接下来,然后交一份自己都心虚的答卷——那样既耽误事,也辜负了您。","另外有个小请求:无论最后怎么安排,麻烦您跟相关同事沟通时,帮我把「时间冲突」的客观情况带到,我不想让大家误以为是我在挑活儿、讲条件。团队和气比什么都重要,这点我比谁都清楚。"]],["职场沟通","团建年会祝酒词","约 3 分钟",["各位同事，大家晚上好！先别急着动筷子，容我说几句心里话，就三分钟。","这一年，咱们团队过得不容易。年初定目标的时候，说实话，我心里是打鼓的——那个数字，往那一放，够所有人喝一壶的。但今天回头一看，我们不但完成了，还超额完成了 15%。这 15% 是怎么来的？是会议室里一遍遍推翻重来的方案，是无数个灯火通明的加班夜，是每一次有人喊\"撑不住了\"的时候，旁边人说\"再扛一下，我帮你\"。","我想特别感谢三个人。感谢老张，关键项目掉链子的那天，是他凌晨两点从家里赶回来救的场；感谢小李，作为新人第一个月就顶上了最难缠的客户，没掉过一次链子；也感谢每一位没被我点到名字、但同样拼尽全力的你——团队的军功章，人人有份。","新的一年，我不说什么豪言壮语，就许三个朴素的愿望：第一，业绩稳中有进，奖金实实在在；第二，大家都健健康康，少熬夜、多锻炼；第三，团队越来越像一个家，来了就不想走。","来，让我们举起杯——敬过去一年的不容易，敬身边并肩的兄弟姐妹，也敬更好的明年！干杯！","说到这儿,还想跟大伙儿道个歉。这一年我脾气急,催进度的时候嗓门大了点,复盘会上话说重了点,伤了哪位兄弟的心,这杯我先干为敬——都是为了让活儿更好,没半点看轻谁的意思。当然,道歉归道歉,明年的标准,一分都不降。","来,再倒满!最后一句话送给所有人:工作是做不完的,但一起奋斗过的日子,过一天少一天,值得好好珍惜。为了我们,干杯!"]],["职场沟通","向资深前辈请教","约 3 分钟",["王总，占您几分钟时间，想向您请教一个问题，不会太久。","是关于我手上这个跨部门协作项目的。事情的背景是这样：项目涉及我们部门和研发、市场两个团队，目前卡在一个关键节点上——两个团队对优先级的理解不一致，各说各有理，会议开了三次也没能收敛。我作为项目的协调人，压力挺大的。","我自己目前的思路是走\"向上借力\"的路子：把两个方案各自的投入、产出、风险列成一张对比表，提交给三方的分管领导去拍板。但我有个顾虑——这样虽然能出结果，但赢得比较\"硬\"，输的一方心里可能不舒服，后面的配合会打折扣。","之所以特别想请教您，是因为我了解到您早年在集团的时候，牵头过一个比这复杂得多的多方协作项目，最后各方都挺服气。我很想知道，当时您是怎么权衡\"把事做成\"和\"把关系做好\"这两件事的？有没有什么我现在这个阶段容易踩的坑？","您不用急着回复我，什么时候方便什么时候聊，哪怕给我指个方向、推荐个方法也好。先谢谢您，听君一席话，少走很多弯路。","我为什么执着于把这件事做「漂亮」,还跟您交个底:这个项目是我来公司后第一个独立协调的跨部门任务,我很清楚它的成败会定义大家对我的第一印象。所以我不只是想把事推进完,更想通过它学会一种能复用的做事方式——这比项目本身更重要。","您如果有空,我想约您二十分钟,当面听您讲讲当年的故事。咖啡我备好,您只管动嘴。再次感谢,等您消息!"]],["日常社交","给连续熬夜的朋友一句关心","约 3 分钟",["亲爱的，最近看你朋友圈都是凌晨两三点还在发动态，想跟你说说心里话。","我不是要劝你别努力，只是真的担心你的身体。我记得去年你住院那次，医生说的最多的一句话就是「再熬就晚了」。","你总说项目赶进度、老板盯得紧，这些我都懂。但我们可以换个方式：把大任务拆成小块，每天留半小时给睡眠，效率未必更低。","这周末我来给你煮点汤，你只管睡到自然醒。朋友不是只在开心时才在，熬夜伤身这种事，我必须多嘴一次。","答应我，今晚十二点前把手机放下。好吗？"]],["职场沟通","向老板争取调休的话术","约 3 分钟",["领导好，想跟您请半天调休——下周三下午，家里有点急事需要处理。","手头的工作我已经排好了：周三上午的评审会我提前到周二开，周报也写好了草稿，不会耽误进度。","如果那天有突发情况，我手机随时在线，紧急的事您直接打我电话，我半小时内能响应。","这次调休不影响本月的其他排班，下周末我可以替同事顶一天班补回来。","您看这样安排可以吗？方便的话我在系统里提交申请，您批一下就好。谢谢领导！"]],["日常社交","拒绝不合理请求的委婉方式","约 3 分钟",["这件事我其实挺想帮你的，但实话实说，这周我自己的截止日期也堆到下巴了。","如果我硬接下来，两头都做不好，反而耽误你。所以这次我得老实说——我接不了。","不过我可以帮你想到两个人选，或者把流程文档发你，你照着走能省不少时间。","真的抱歉，等这阵忙完，下次你开口我一定优先。这次先说声抱歉啦。"]],["职场沟通","项目复盘会上怎么说话不得罪人","约 3 分钟",["今天的复盘，我想先说我们做得好的：需求对齐比上次快了两天，这点值得记下来。","再说可以更好的地方——不是某个人，是流程。我们两次返工都出在「上游信息没同步」这一步。","我的建议是，下个版本把同步会固定成每周一，谁负责哪块一目了然，能少踩很多坑。","我不点名，因为问题不在人，在机制。把机制补上，大家都能轻松点。","以上是我的一点想法，欢迎大家补充，尤其是被我漏掉的角度。"]],["日常社交","在家庭群报平安的小作文","约 3 分钟",["爸妈，到啦，宿舍挺暖和的，楼下就有食堂，不用担心我饿着。","今天上了两节课，老师讲得慢，我基本跟得上。同桌人很好，借我笔记还请我喝了奶茶。","钱够花，卡里还有不少，别偷偷往我账户打钱了，上次那笔我都存起来了。","天气转凉，你们自己也要加衣服，爸的膝盖记得贴膏药。我周末视频，先忙啦，爱你们！"]],["职场沟通","跨时区会议怎么约大家都舒服","约 3 分钟",["Hi team, 关于每周同步会的时间，我想重排一下，让两边的同事都不用太牺牲。","之前固定在北京时间晚上九点，伦敦的同事其实是下午两点，还算好；但旧金山这边是早上五点，确实太早了。","我提议轮着来：这周迁就亚洲晚间，下周迁就美洲早间，公平一点。会议录屏会发群里，错过的同事看回放就行。","如果大家同意，我从下周一排起，日历邀请马上发。谢谢理解！"]],["日常社交","给搬家朋友的暖房小卡片","约 3 分钟",["恭喜乔迁！新家采光真好，阳台那盆绿植我一眼就喜欢。","这小东西你先收着——一盏夜灯，加班回来玄关亮着，心里踏实。不是什么贵重物，但挑了很久。","以后周末我来蹭饭，你负责掌勺，我负责洗碗，分工明确。","对了，楼道感应灯有点暗，我顺手在你门口贴了张反光条，安全点。住得舒服，常来玩！"]],["职场沟通","把「我做不到」换成「我能做到这些」","约 3 分钟",["收到这个需求，我先说结论：完整版我这边两周内交不出来，但不是没有办法。","我能做的是先给你一版「核心三个功能」的可运行 demo，下周一到，够你拿去给客户演示。","剩下两个高级功能，我列了依赖清单，等设计稿确认后十天能补齐。","所以不是「做不了」，是「分两步走更稳」。你看是先要 demo 还是连着等终版？我听你的。"]],["日常社交","安慰失恋朋友的微信长文","约 3 分钟",["看到你发的那条朋友圈，我沉默了很久。想了想，还是得跟你说点人话。","分手很痛，这点我不替你轻描淡写。但我想告诉你：你上一段关系里那些小心翼翼，其实早就累了，只是自己没察觉。","这几天别逼自己坚强，想哭就哭，想点外卖就点，我随时在线，半夜也接。","等你觉得可以了，我带你去那家你念叨很久的日料店。人要先把自己照亮，才照得亮别人。慢慢来，我在。"]],["职场沟通","向上汇报坏消息的正确姿势","约 3 分钟",["领导，有个情况得第一时间跟您同步：今天服务器出了一次宕机，影响约四十分钟，已恢复。","我先说结论——数据没丢，备份机制顶住了，用户侧只有访问延迟，没有资损。","原因初步定位是一次配置误改，我已回滚，并加了双人复核。完整的事故报告明天上午给您。","这次是我这边把关不严，责任我担。后续我会把变更流程再收紧一档，避免重演。先跟您报备，不瞒不拖。"]],["日常社交","在家长群礼貌提醒收作业","约 3 分钟",["各位家长好，温馨提醒：本周的亲子阅读打卡表，麻烦今晚前提交到群里接龙～","老师说明天要用，咱们别让孩子白准备。已经交过的家长不用重复，辛苦啦！","有家长问格式，我放个模板在群文件了，照着填就行，三行以内很简单。","感谢配合，孩子们这周都特别认真，为咱们班点赞！"]],["职场沟通","离职时得体告别的一封邮件","约 3 分钟",["各位，写这封邮件有点不舍。我将于本月底正式离开，去尝试一段新的职业方向。","在公司的三年，从第一次独立带项目到后来带人，我学到的比想象中多。谢谢各位的信任和包容。","手头工作我已和接替的同事做了完整交接，文档在共享盘「交接」文件夹，有疑问随时找我，离岗后也回。","山水有相逢，愿大家一切顺利。我的个人邮箱附在签名，欢迎保持联系。"]],["日常社交","给许久未联系老友的破冰消息","约 3 分钟",["嘿，突然想起你，翻到去年咱们在洱海那张合影，笑得真好。","最近过得怎么样？我这边一切照旧，工作忙但安稳，猫也长得圆了。","没别的事，就是好久没聊了，想打个招呼。你那边换工作了吗？上次听你说在考虑。","有空回我一句就行，不急。咱俩这交情，断不了，慢慢续。"]]];

const __DATA_POD_ART__   = {"10716":["如果一段关系让你越来越怀疑自己,却越来越离不开对方——请警惕,这可能是情感操控,而不是爱。这期节目里,主持人以亲身经历为线索,完整拆解了一段「看起来像爱情」的操控关系是如何一步步成形的。","节目最值得听的部分,是对细节的还原:从最初无微不至的关注,到慢慢切断你与朋友的联系,再到让你觉得「离开他我就什么都不是」。每一步都包装成爱的样子,每一步都在收走你的自我。主持人复盘了自己如何从「我以为是我太敏感」走到「原来这是有名字的」,这段觉醒过程对任何身处类似关系的人都有参考价值。","后半段聊的是恢复:重建自我价值感需要多久、如何重新信任自己的判断、身边人可以怎样帮上忙。没有鸡汤,只有坦白。","适合通勤路上戴耳机听。如果你或你身边的人正在一段让你「越来越不像自己」的关系里,这期节目值得完整听完。"],"10539":["杀猪盘为什么屡屡得手?不是受害者太傻,而是骗局已经进化成了一门「专业」。这期节目系统梳理了社交媒体时代的新型骗局图谱:从婚恋交友里的人设包装,到冒充名人粉丝群的投资陷阱,再到 AI 换脸带来的「熟人借款」新变种。","节目里最扎心的洞察是:骗子的核心武器不是谎言,而是「需求」。孤独的人缺陪伴,焦虑的人缺捷径,每个人都有一扇为特定需求留的门,骗局只是找到了那扇门。主持人用几个真实案例展示了话术如何一步步试探、加码、收割——节奏感和电视剧一样紧凑。","后半部分给出了实用清单:如何反向验证一个人的社交痕迹、哪些「反常识」细节是危险信号、被骗后第一时间该做的三件事。","适合所有人听一遍当「疫苗」。信息密度高,建议开 1.25 倍速,重点记后半段的防骗清单。"],"8291":["一场约会在甜蜜氛围中结束,第二天清晨,女生发现自己的银行账户被清空了。这不是虚构剧本,而是发生在加州的真实案件。这期节目以案件调查为主线,串起了受害者视角、警方视角和庭审视角的三重叙事。","前半段像一部侦探剧:警方如何从监控里锁定嫌疑人、如何发现这是连环作案、受害者如何应对「为什么你会被骗」的二次伤害。后半段进入更深的讨论——约会软件时代,我们与陌生人建立信任的速度前所未有地快,但验证机制几乎为零。","节目没有把责任推给任何一方,而是冷静地拆解了「信任是如何被技术加速、又被技术利用的」。结尾对受害者的采访尤其值得听:她说自己最需要的不是同情,而是别人告诉她「这不能怪你」。","单集时长适中,叙事紧凑,适合一个人安静地听完,听完你会重新审视手机里那些「聊得很好」的陌生人。"],"8256":["你确定屏幕对面的人,是他自称的那个人吗?这期节目收集了多个不可思议的网络身份造假案例:伪造学历履历的「精英」、盗用他人照片的「完美恋人」,甚至一个人同时经营着五个完全不同的人设。","第一个案例就足够震撼:一位网友与「女友」网恋两年,谈婚论嫁之际才发现,对方不仅性别是假的,连照片里的那个人也在完全不知情的情况下「被恋爱」了两年。节目细致还原了造假者如何用几百张照片、精心设计的生活细节,织出一张以假乱真的网。","后半段请到了研究网络身份的心理学者,解释了为什么人会对着屏幕上的「人设」投入真实感情——大脑处理情感的部分,并不区分线上与线下。这期节目最实用的收获,是一套「三步验证法」:查照片、查时间线、查社交一致性。","适合喜欢真实案件+心理分析的听友。案例多、节奏快,通勤或做家务时听都很合适。"],"6756":["如果生命只剩下最后的时光,你会怎么过?这期节目的主人公,一位五十多岁的女性,在确诊之后做出了让所有家人震惊的决定:离开维持了二十多年、早已名存实亡的婚姻,搬去海边小镇,重新开始。","这不是一个悲伤的故事,恰恰相反——它关于欲望、亲密与死亡的三场坦诚对话,反而充满了生命力。她聊自己年轻时为「应该」而活的一生:该结婚时结婚、该生育时生育,唯独没有问过自己想要什么。她聊确诊那一刻奇异的轻松感:「终于可以理直气壮地为自己活了。」","节目的后半段是她与死亡正面相处的日常:如何告诉孩子、如何面对身体的衰退、如何在最后的日子里依然对世界保持好奇。主持人克制而不煽情的提问,让整期节目像深夜里两位老友的对谈。","推荐在安静的夜晚独自听。它会让你想认真过好现在的生活——不是被吓出来的珍惜,而是被点燃的那种。"],"10660":["「你最近一次感受到情绪,是什么时候?」这个看似简单的问题,难住了绝大多数成年人。这期节目聊的是被我们刻意关闭的东西:身体感受与情绪的连接。","主持人从自己的故事讲起:连续加班数年后,她发现自己「什么都感觉不到」——不是难过,也不是开心,而是一种麻木的平。看喜剧不笑,听坏消息不哭,连饿了都感觉不到。这期节目就是她重新学习「有感觉」的完整记录。","节目里介绍了身体扫描练习的入门方法:从感受双脚踩地的重量开始,一点点找回身体发来的信号。有意思的是,当身体感受恢复后,积压的情绪往往会先决堤——主持人形容那是「迟到了好几年的大哭一场」。嘉宾心理学者解释了为什么情绪一定会在身体上留下痕迹,以及「感受力」如何一步步练回来。","适合睡前或冥想前听,听完可以直接跟着做一次身体扫描。对长期高压、总觉得「麻麻的」的人尤其值得一听。"],"6717":["470 亿美元估值,到几乎归零——WeWork 的崩塌,是这个时代最盛大的一场商业狂热事故。这期节目完整复盘了从神话到笑话的全过程。","故事的主角是一位极富魅力的创始人:他把「共享办公」包装成「提升世界的意识水平」,把亏损包装成「增长的投资」,把派对文化包装成「企业文化」。软银等顶级投资机构为何争着送钱?节目中拆解了那个时代的 FOMO 情绪:所有人都在怕错过下一个大故事,以至于没人敢问「这生意到底怎么赚钱」。","最精彩的部分是崩塌的细节:招股书里一页页荒诞的自我披露、创始人在 IPO 前夕被踢出局、员工们从「改变世界」的幻觉中醒来面对失业。节目最后把这面镜子转向听众:你确定自己现在相信的某个「故事」,不是下一场 WeWork 吗?","适合对商业、创业、投资感兴趣的人。叙事节奏极佳,像听一部有声商战剧,上下班路上两集连听刚刚好。"],"8364":["商业世界的游戏规则,是由那些站在聚光灯之外的人写成的。这期系列节目走近全球企业背后不为人知的高管们:他们如何决策、如何内斗、如何在关键节点改变一家公司的命运。","节目选取的案例跨度很大:有临危受命、力挽狂澜的救火队长;有把百年老店带进新时代却黯然离场的改革者;也有在董事会政治中败下阵来的「差点改变历史的人」。每个案例都来自公开报道与传记的深度整合,细节扎实。","听完最大的感受是:企业叙事里被反复歌颂的「战略远见」,背后常常是无数次慌乱的权宜之计;而真正决定成败的,往往是执行层那些没人记录的日夜。节目还讨论了一个有意思的话题:为什么有些高管跳槽到哪里,哪里就起飞——「人」可能才是商业模式里最被低估的变量。","适合管理学爱好者和职场人。单集信息量大,适合通勤分段听,记得准备好被同事问「你在听什么这么入迷」。"],"8760":["大品牌也不是生来伟大——很多今天如雷贯耳的名字,当年都差一步就死掉。这档节目专门拆解「小品牌如何逆袭」的隐藏配方,案例覆盖消费、餐饮、科技等多个行业。","一期典型的节目会完整还原一个品牌从 0 到 1 的关键决策:第一桶金从哪来、第一个爆款怎么砸出来的、濒临破产时靠什么翻身。你会发现逆袭很少靠「天才创意」,更多靠对某个小众需求的死磕、对成本的极致控制,和一点点被逼出来的运气。","特别推荐给正在做小生意或打算创业的听友:节目里没有「改变世界」的宏大叙事,全是「这个月房租怎么挣出来」的真实颗粒度。比如有一期聊到一家小店靠「允许顾客自带杯子减五块」的土办法熬过了疫情,这种细节比任何商学院案例都生动。","单集 30-40 分钟,节奏轻快,适合做家务、开车时听,听完总能带走一两个能用的点子。"],"5279":["你今天说出的每句俚语、持有的每个观念,背后都可能藏着一段波澜壮阔的美国历史。这档节目用「从冷战到太空竞赛」的一条条历史线,串起了现代生活的隐形来源。","比如有一期讲「婴儿潮一代」如何塑造了今天的一切:从房地产逻辑到消费文化,再到代际冲突的起源;还有一期讲冷战如何催生了互联网、GPS 和现代科研体系——你手机里的每一项底层技术,几乎都是那段紧张年代的遗产。","节目的高明之处在于视角:它不讲帝王将相,而讲「历史如何流进普通人的生活」。听完你会获得一种新的观察角度:当下任何一件「理所当然」的事,拆开看都有历史成因;而今天正在发生的重大事件,也在塑造几十年后的日常。","适合历史爱好者和想提升认知框架的听友。语速适中、结构清晰,通勤听毫无压力,每集都能带走一个可以在饭桌上分享的冷知识。"],"5629":["瘟疫、革命、技术浪潮——把镜头拉远到几百年的尺度,文明的走向会呈现出完全不同的逻辑。这档节目用历史的长镜头看世界,每一期都试图回答:那些改变一切的力量,当时的人看得见吗?","一期印象深刻的节目讲黑死病:短短几年带走欧洲三分之一人口,却意外动摇了教会权威、抬高了劳动者身价,被视为文艺复兴的隐性推手。另一期讲工业革命,拆解了「发明改变世界」的迷思:蒸汽机其实早存在了几十年,真正引爆变革的是煤价、工资与专利制度凑齐的那一刻。","这种「长镜头」视角的迷人之处在于,它会改变你判断当下的方式:新闻里的热点在十年尺度上是噪音,而某些当时无人注意的结构性变化,才是历史真正的转弯处。","适合喜欢大历史、大逻辑的听友。每期主题独立,可以从任何一集入坑;建议开 1.5 倍速,信息密度高但不烧脑。"],"8514":["绝境里的普通人,能爆发出怎样的意志力?这档节目收集了极端逆境中活下来的真实故事:矿难、海难、荒野迷路、战乱逃亡……每一个都真实到让你手心出汗。","节目不猎奇,它真正想回答的问题是:活下来的人做对了什么?听完几十个案例,会发现惊人的共性——幸存者往往不是最强壮的,而是最冷静的:他们会立刻接受现实,制定极小的目标(撑过今晚、走到那棵树),并严格管理自己的情绪与体力。有一期讲被困雪山的登山者,靠每半小时咬一口巧克力、默背女儿生日的方式撑了九天。","节目还请心理学者分析了「精神崩溃」的真实机制:绝望不是瞬间发生的,而是被一个个「放弃的小决定」喂养出来的。这对日常生活同样适用——健身房最后三个、项目的最后一周,撑住的逻辑是一样的。","适合喜欢真实故事+心理分析的听友。注意部分情节较紧张,不建议深夜独自听,通勤时听效果最佳。"],"8860":["权力的暗面长什么样?这档节目一期一个改变英国走向的著名丑闻:从议会里的权钱交易,到媒体与政客的合谋,再到被掩盖了几十年的机构性丑闻。","节目的好看之处在于「解剖」而非「爆料」:每期都会还原丑闻从第一次越界到东窗事发的时间线,你会清楚看到,巨大的丑闻从来不是某个坏蛋一夜干成的,而是一群普通人在无数个「就这一次」「大家都这样」的瞬间里,共同滑向深渊。有一期讲到某机构内部其实早有人举报,但层层汇报后石沉大海——制度如何消化掉良心,是整季最 chilling 的一集。","对权力运作机制的兴趣,是人类的天性。听完这档节目,你会对「组织如何防腐」有更清醒的认识,也会更珍惜每一次公开的监督。","适合时事政治爱好者。英式叙事冷静克制,语速不快,非常适合当作通勤时的「严肃内容」配额,每集信息都足够撑起一天的思考。"],"9041":["历史上那些被一笔带过的名字,如果深挖下去,往往藏着最鲜活的人生。这档节目做的是「传记考古」:用真实史料还原那些被历史尘埃覆盖的人物——她们可能只是某个大事件里的一行注脚,但她们的人生本身足够震撼。","一期典型的节目会从一个小切口进入:一封没寄出的信、一张档案馆里的老照片、一份尘封的庭审记录,然后层层展开一个人完整的一生。有一期讲一位十九世纪的女性,顶着整个时代的反对成了家族经济的顶梁柱,她的故事被子孙刻意隐去,因为「不光彩」;直到节目组翻出账本,才发现她撑起了整整三代人。","这档节目的价值在于视角的翻转:历史书写权永远偏向胜利者与男性,而那些真实的挣扎、的爱与野心,需要有人专门去打捞。听着听着你会开始好奇:我自己家族里,又有多少这样的名字?","适合喜欢人物故事、传记与历史细节的听友。叙事温柔而有力量,非常适合睡前听——不会有惊悚内容,但会让你带着一点敬畏入睡。"],"5702":["如果可以换一种身份重新活一遍,你会怎么选?这档沉浸式人物传记播客,每期带你「住进」另一个人的一生:从他的出生讲起,经过他人生的每个关键路口,直到终点。听的过程,就像真的借了一副眼睛活了一次。","节目选题极广:有帝王的私生子、战场的军医、赌场的发牌员、逃亡的科学家……无论起点多低或多高,主持人都能找到那个「人生转弯处」——那个他们做出关键选择、并为此付出代价的瞬间。有一期讲一位女飞行员,在女性被禁止飞行的年代,靠给轰炸机做试飞员杀出一条血路,晚年在小机场教贫民窟的孩子开飞机。","这类「换位人生」的听感非常独特:它不是知识,而是体验。听别人的完整一生,会自然生出对自己人生的旁观视角——你现在纠结的事,放在一生的尺度里是什么重量?","单集偏长,适合长途旅行、周末散步或睡前连听。建议从你感兴趣的职业或时代入坑,一旦入坑就会一集接一集停不下来。"],"5718":["当正义需要被「设计」才能伸张,这本身就值得警惕。这档真实案件节目,专注于一类特殊的故事:那些精心布局的犯罪,与同样精心布局的反击。","一期典型节目会花大量篇幅还原「局」的构造:诈骗犯如何用三年时间经营一个假身份;杀妻骗保案的凶手如何在投保、意外、理赔每个环节都做满铺垫;而执法者这边,如何用一条几乎断裂的证据链,靠心理战撬开缺口。节目的立场很克制:不为猎奇,而是想让你看见「完美犯罪」从来不存在——破绽藏在人性里。","最值得听的是那些「几乎失败」的追凶故事:警官追一个线索追了十几年,退休后又以顾问身份回来接着查。这类故事听得人既唏嘘又踏实:原来真的有人在看不见的地方,较真了那么多年。","适合真实罪案爱好者。叙事紧凑像追剧,但注意部分案件涉及暴力情节,建议白天通勤听;每集结尾都有案件的法律结果交代,不挖坑。"],"10276":["人类历史的每一次大转弯,几乎都有疾病的影子。这档节目用流行病学的视角重新理解世界:瘟疫不只是灾难,它还是历史的「隐形推手」。","节目横跨古今:雅典瘟疫如何改变伯罗奔尼撒战争的结局、天花如何成为殖民者的「生物武器」、1918 大流感如何在终结一战的同时重塑全球公共卫生体系,以及 HIV 危机如何改写了现代医学伦理与患者权利。最新几期则聚焦当下:后疫情时代,我们从那几年里真正学到了什么、又快速遗忘了什么。","流行病学视角最颠覆认知的一点是:疾病从来不「公平」——它总是沿着社会的裂缝传播。贫富、阶层、居住密度,决定了谁先倒下。听完你会明白,公共卫生本质上是政治与分配问题,而不只是医学问题。","适合对历史、医学、社会议题都感兴趣的听友。科学部分讲得深入浅出,无需专业背景;建议按主题选听,通勤听刚好一集。"],"5012":["他是同事口中「最好的医生」,也是警方档案里最冷血的嫌疑人——这种反差,正是这期节目最让人不安的地方。故事围绕一位深受爱戴的医生展开:病人们排队求他看病,同事们以与他共事为荣,直到一些数字开始对不上。","节目用调查报道的方式推进:先是统计学家发现,这位医生值班时的患者死亡率显著高于其他时段;接着是药房的麻醉药品记录出现缺口;然后是同事的回忆被逐条重新审视——那些当时被解读为「敬业」的深夜留守,有了另一层含义。","这期节目真正想讨论的,是「信任的悖论」:我们对白大褂的信任,恰恰是这类案件得以长期隐藏的土壤。医疗系统靠什么自查?告密的医生要承受什么?节目没有给出轻松的答案,但把问题的复杂度完整呈现了出来。","适合医疗题材与真实罪案爱好者。节奏偏慢热,前 15 分钟铺垫较长,坚持到中段会完全停不下来;建议整块时间听完。"],"5964":["三十年,足以让一个孩子长大成人,也足以让一桩悬案的卷宗积满灰尘。这档节目讲述的,是加州史上最令人恐惧的连环杀手案之一,以及一场跨越三十年、横跨两代刑警的追凶。","节目的前半段还原了案发年代的恐惧:小区里的守夜巡逻、孩子们不再单独出门、以及那条始终没有等到的破案新闻。中段讲案件几度重启:DNA 技术的成熟让旧证据重新开口,基因族谱网站的出现让「无名者」第一次有了被指认的可能。老刑警退休前把办案笔记交给徒弟的那一段,是整期最动人的地方。","值得一提的是,节目没有停留在「抓住他了」的爽感上,而是用相当篇幅呈现了幸存者与受害者家属的三十年——正义迟到的时候,他们的人生已经过完了大半。这层沉重,让整期节目超越了普通罪案叙事。","适合罪案纪实爱好者,单集较长,适合长途通勤或周末整块时间;结尾有一段法庭宣判的实录,冲击力很强,请做好心理准备。"],"6807":["豪宅、头衔、联姻、恩怨——名门望族的故事,永远比电视剧精彩,因为它们是真的。这档节目深入各个豪门家族的爱恨情仇,你会发现:钱能解决的问题都不是问题,真正的问题,钱解决不了。","一期典型节目会讲透一个家族的三代人:创一代如何野蛮生长,守一代如何在光环与平庸之间挣扎,富三代如何在「生下来就什么都有了」的虚无里找事情做。有兄弟对簿公堂三十年只为争夺「家长权威」的,有老太太用遗嘱安排每个子女命运的,也有家族企业传到第三代被一纸离婚案分走半壁江山的。","节目最值得听的,是它对「豪门也是人」的洞察:遗产争夺战的底层,常常是童年缺的那个拥抱;联姻的算计里,也藏着父母笨拙的爱。听完你会对这些新闻里的家族多一层理解——他们不是新闻标题里的符号,而是一群被财富放大的普通人。","适合喜欢家族史、真实故事与社会观察的听友。叙事通俗流畅,非常适合当「下饭播客」,与家人一起听还能顺便聊聊自家的「家族史」。"]};

/* ==================== 工具与存储 ==================== */
/* 账号命名空间:不同账号对应不同用户,数据隔离保存在 localStorage(附加要求:不改用云端存储) */
let __account = null; // 当前登录账号(null 表示未登录/游客)
function accKey(k){ return __account ? ('acc:' + __account + ':' + k) : k; }

/* ============ Supabase 云端同步层(纯 fetch,不依赖 CDN) ============ */
/* 使用 Supabase Auth 做真实注册/登录(注册用户记录在 auth.users),
   云端数据按 user_id 隔离(RSL: auth.uid() = user_id)。每次刷新先恢复会话再拉数据。 */
let __cloud = {
  url: '', key: '', enabled: false, online: false, ready: false, onStatus: null,
  uid: null,   // 当前登录用户的 auth.uid()(null=游客)
  email: null  // 当前登录邮箱
};
function cloudInit(){
  try{ const cfg = (window.__APP_CONFIG__ || {}); __cloud.url = cfg.SUPABASE_URL || ''; __cloud.key = cfg.SUPABASE_ANON_KEY || ''; }catch(_){}
  // 必须有 URL 且 key 以 eyJ 开头(JWT anon key 才能访问数据表);sb_publishable_ 仅用于 Auth
  __cloud.enabled = !!(__cloud.url && __cloud.key && __cloud.key.indexOf('eyJ') === 0 && __cloud.url.indexOf('supabase') > -1);
  return __cloud.enabled;
}
function cloudHeaders(extra, withAuth){
  const h = Object.assign({ 'apikey':__cloud.key }, extra || {});
  // withAuth=false 用于 Auth 端点(用 anon key 即可);withAuth=true 数据端点带当前用户 Bearer
  if(withAuth !== false){
    const sess = Store.get('wws:sb_session', null);
    const tok = sess && sess.access_token ? sess.access_token : __cloud.key;
    h['Authorization'] = 'Bearer ' + tok;
  } else {
    h['Authorization'] = 'Bearer ' + __cloud.key;
  }
  return h;
}
function cloudSetStatus(online, note){
  __cloud.online = online;
  const el = document.getElementById('cloudStatus');
  if(el){
    el.className = 'cloud-badge ' + (online ? 'online' : 'offline');
    const who = __cloud.uid ? (' · ' + (__cloud.email || '已登录')) : '';
    el.innerHTML = (online ? '☁️ 云端已同步' : '📴 仅本地') + who + (note ? ' · ' + note : '');
    el.onclick = cloudManualSync;
  }
  if(__cloud.onStatus) try{ __cloud.onStatus(online) }catch(_){}
}
/* ---- 带超时的 fetch 封装 ---- */
function cloudFetch(url, opts, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  const ctrl = new AbortController();
  const to = setTimeout(()=> ctrl.abort(), timeoutMs);
  opts = opts || {};
  opts.signal = ctrl.signal;
  return fetch(url, opts).then(r => { clearTimeout(to); return r; }, e => { clearTimeout(to); throw e; });
}
/* ---- token 续期:用 refresh_token 换 access_token,成功后更新本地会话 ---- */
let __cloudRefreshing = null; // 并发续期只跑一次
function cloudRefreshToken(){
  if(__cloudRefreshing) return __cloudRefreshing;
  __cloudRefreshing = new Promise((resolve) => {
    const sess = Store.get('wws:sb_session', null);
    if(!sess || !sess.refresh_token){ resolve(false); __cloudRefreshing = null; return; }
    cloudFetch(__cloud.url + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers: cloudHeaders({'Content-Type':'application/json'}, false),
      body: JSON.stringify({ refresh_token: sess.refresh_token })
    }, 10000)
      .then(r => r.json().then(j => ({ok:r.ok, j})).catch(()=>({ok:false})))
      .then(({ok, j}) => {
        if(ok && j.access_token){
          // refresh 返回的新 refresh_token 优先,缺失则沿用旧的
          j.refresh_token = j.refresh_token || sess.refresh_token;
          j.user = j.user || sess.user;
          saveSession(j);
          resolve(true);
        } else {
          // 续期失败(refresh 也过期)→ 视为登出
          cloudHardLogout();
          resolve(false);
        }
      })
      .catch(() => { resolve(false); })
      .finally(() => { __cloudRefreshing = null; });
  });
  return __cloudRefreshing;
}
/* ---- 自动续期的数据请求:遇 401 自动 refresh 并重试一次 ---- */
function cloudAuthFetch(url, opts, timeoutMs){
  return cloudFetch(url, Object.assign({}, opts, { headers: cloudHeaders(opts && opts.headers, true) }), timeoutMs)
    .then(r => {
      if(r.status === 401){
        return cloudRefreshToken().then(ok => {
          if(!ok) return r; // 续期失败,返回原 401 响应
          // 续期成功,用新 token 重试一次
          return cloudFetch(url, Object.assign({}, opts, { headers: cloudHeaders(opts && opts.headers, true) }), timeoutMs);
        });
      }
      return r;
    });
}
/* ---- 串行同步队列:避免并发保存互相覆盖 ---- */
let __syncChain = Promise.resolve();
function cloudSyncUp(key, value){
  if(!__cloud.enabled || !__cloud.uid) return; // 仅登录用户写云端;游客留本地
  const payload = { account: __cloud.uid, key, value, user_id: __cloud.uid };
  // 串行化:每个上行排队,前一个完成(或失败)后才进行下一个,避免并发覆盖
  __syncChain = __syncChain.then(() =>
    cloudAuthFetch(__cloud.url + '/rest/v1/app_data', {
      method:'POST', headers: cloudHeaders({'Content-Type':'application/json','Prefer':'resolution=merge-upsert'}, true),
      body: JSON.stringify(payload)
    }, 10000)
      .then(r => { if(!r.ok) throw new Error('up ' + r.status); cloudSetStatus(true); })
      .catch(() => cloudSetStatus(false))
  ).catch(()=>{});
}
/* ---- 云端删除:按 account + key 删除单行(配合 Store.del 实现跨端删除同步) ---- */
function cloudSyncDel(key){
  if(!__cloud.enabled || !__cloud.uid) return;
  const q = '/rest/v1/app_data?account=eq.' + encodeURIComponent(__cloud.uid) + '&key=eq.' + encodeURIComponent(key);
  __syncChain = __syncChain.then(() =>
    cloudAuthFetch(__cloud.url + q, { method:'DELETE', headers: cloudHeaders({}, true) }, 10000)
      .then(() => {})
      .catch(() => {})
  ).catch(()=>{});
}
/* ---- Supabase Auth:会话恢复/注册/登录 ---- */
function cloudRestoreSession(cb){
  if(!__cloud.enabled){ cloudSetStatus(false); if(cb) cb(false); return; }
  // 取本地保存的会话(supabase 客户端不支持,这里用自管 localStorage 会话)
  const sess = Store.get('wws:sb_session', null);
  if(sess && sess.access_token){
    __cloud.uid = sess.user && sess.user.id || null;
    __cloud.email = sess.user && sess.user.email || null;
    if(cb) cb(!!__cloud.uid);
    return;
  }
  __cloud.uid = null; __cloud.email = null;
  if(cb) cb(false);
}
function cloudSignUp(email, password, cb){
  if(!__cloud.enabled){ if(cb) cb(false, '未配置云端'); return; }
  cloudFetch(__cloud.url + '/auth/v1/signup', {
    method:'POST', headers: cloudHeaders({'Content-Type':'application/json'}, false),
    body: JSON.stringify({ email, password, data: { app: 'magic-castle' } })
  }, 10000).then(r => r.json().then(j => ({ok:r.ok, j}))).then(({ok, j}) => {
    if(!ok || j.error){
      let msg = (j.error && j.error.message) || '注册失败';
      // 翻译常见错误为中文提示
      if(/rate limit|email send/i.test(msg)) msg = '注册邮件发送受限(免费额度),请到 Supabase 后台关闭「Email Confirmation」后重试,或稍后再试';
      else if(/confirm|verification/i.test(msg)) msg = '注册成功,请查收邮件激活后再登录';
      else if(/already/i.test(msg)) msg = '该邮箱已注册,请直接登录';
      if(cb) cb(false, msg);
      return;
    }
    if(j.access_token){ saveSession(j); if(cb) cb(true, '注册成功,已自动登录'); }
    else { if(cb) cb(true, '注册成功,请查收邮件激活后登录'); }
  }).catch(e => { if(cb) cb(false, '网络错误'); });
}
function cloudSignIn(email, password, cb){
  if(!__cloud.enabled){ if(cb) cb(false, '未配置云端'); return; }
  cloudFetch(__cloud.url + '/auth/v1/token?grant_type=password', {
    method:'POST', headers: cloudHeaders({'Content-Type':'application/json'}, false),
    body: JSON.stringify({ email, password })
  }, 10000).then(r => r.json().then(j => ({ok:r.ok, j}))).then(({ok, j}) => {
    if(!ok || j.error){ if(cb) cb(false, j.error && j.error.message || '登录失败'); return; }
    saveSession(j);
    if(cb) cb(true, '登录成功');
  }).catch(e => { if(cb) cb(false, '网络错误'); });
}
function saveSession(j){
  __cloud.uid = j.user && j.user.id || null;
  __cloud.email = j.user && j.user.email || null;
  Store.set('wws:sb_session', { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user });
}
function cloudSignOut(){
  const sess = Store.get('wws:sb_session', null);
  if(sess && sess.access_token){
    cloudFetch(__cloud.url + '/auth/v1/logout', { method:'POST', headers: cloudHeaders({'Content-Type':'application/json'}, true), body: JSON.stringify({}) }, 8000).catch(()=>{});
  }

  __cloud.uid = null; __cloud.email = null;
}
/* ---- 彻底登出:清除会话 + 本地账号数据 + 全局状态,回到无数据游客态 ---- */
function cloudHardLogout(){
  try{
    // 1) 清掉当前账号命名空间下的全部本地数据(账号间隔离)
    const prefix = __account ? ('acc:' + __account + ':') : '';
    const keys = Object.keys(localStorage);
    for(const k of keys){ if(k.indexOf(prefix) === 0) try{ localStorage.removeItem(k); }catch(_){} }
    // 2) 清会话、记住的账号等全局态
    Store.del('wws:sb_session');
    try{ localStorage.removeItem('wws:lastAccount'); }catch(_){}
  }catch(_){}
  // 3) 重置全局状态
  __account = null;
  __cloud.uid = null; __cloud.email = null;
  __syncChain = Promise.resolve();
}
function cloudSyncDown(cb){
  if(!__cloud.enabled || !__cloud.uid){ cloudSetStatus(false); if(cb) cb(); return; }
  cloudAuthFetch(__cloud.url + '/rest/v1/app_data?account=eq.' + encodeURIComponent(__cloud.uid) + '&select=key,value', { method:'GET', headers: cloudHeaders({}, true) }, 10000)
    .then(r => { if(!r.ok) throw new Error('down ' + r.status); return r.json(); })
    .then(rows => {
      (rows || []).forEach(row => {
        if(row.key && row.value !== undefined){
          try{ localStorage.setItem(accKey(row.key), JSON.stringify(row.value)); }catch(_){}
        }
      });
      cloudSetStatus(true, '已同步');
      if(cb) cb();
    })
    .catch(() => { cloudSetStatus(false); if(cb) cb(); });
}
function cloudManualSync(){
  cloudSyncDown(() => showToast(__cloud.online ? '☁️ 已从云端同步' : '📴 离线,仅本地保存'));
}

const Store = {
  memory: {},
  get(k, d=null){ k = accKey(k); try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v) }catch(_){ return this.memory[k]??d } },
  set(k, v){
    k = accKey(k);
    try{ localStorage.setItem(k, JSON.stringify(v)) }catch(_){ this.memory[k]=v }
    // 登录用户才异步云端双写(按 user_id 隔离)
    if(__cloud.enabled && __cloud.uid){ try{ cloudSyncUp(k.replace(/^acc:[^:]+:/, ''), v) }catch(_){} }
  },
  del(k){
    k = accKey(k);
    try{ localStorage.removeItem(k) }catch(_){ delete this.memory[k] }
    // 登录用户:云端同步删除(快照差集同步的基础——本地删了,云端也删)
    if(__cloud.enabled && __cloud.uid){ try{ cloudSyncDel(k.replace(/^acc:[^:]+:/, '')) }catch(_){} }
  },
  keys(){ try{ return Object.keys(localStorage) }catch(_){ return Object.keys(this.memory) } }
};

      <div id="todoList">${todos.map((t,i)=>{
        // 时间段:开始(start) 和 结束(end) 两条独立可滚动时间条
        const renderChips = (selected) => {
          let chips = '';

function setTodoRange(i, kind, v){
  const k = 'wws:todos:'+todayStr();
  const ts = Store.get(k, []);
  if(!ts[i]) return;
  // kind: 'start' | 'end'
  if(ts[i][kind] === v){
    // 再点同一档视为清除
    ts[i][kind] = null;
  } else {
    ts[i][kind] = v;
    // 联动校验:结束必须 ≥ 开始
    if(ts[i].start && ts[i].end && ts[i].end < ts[i].start){
      showToast('⚠️ 结束时间需 ≥ 开始时间');
      ts[i][kind] = null; // 回滚这次点击
    }
  }
  Store.set(k, ts);
  // 局部刷新两条时间条与徽章
  ['Start','End'].forEach(suffix => {
    const sc = document.getElementById('ts'+suffix+i);
    if(!sc) return;
    const key = suffix.toLowerCase();
    sc.querySelectorAll('.time-chip').forEach(c=>{
      c.classList.toggle('sel', c.dataset.v === ts[i][key]);
    });
  });
  // 更新徽章
  const item = document.querySelectorAll('.todo-item')[i];
  if(item){
    const body = item.querySelector('.todo-body');
    const old = body.querySelector('.todo-time-badge');
    if(old) old.remove();
    if(ts[i].start && ts[i].end){
      body.insertAdjacentHTML('beforeend', `<i class="todo-time-badge">⏰ ${ts[i].start} – ${ts[i].end}</i>`);
    } else if(ts[i].start){
      body.insertAdjacentHTML('beforeend', `<i class="todo-time-badge">⏰ ${ts[i].start} 起</i>`);
    }
  }
}

/* ==================== 内容渲染:英语学习 (BEC) ==================== */
/* 语音引擎:内嵌 Edge TTS 离线 MP3(构建时预生成,base64 内嵌,无需联网) */

// SRS 状态 —— 严格艾宾浩斯遗忘曲线(8 级间隔)
// 间隔(分钟): 5 / 30 / 720(12h) / 1440(1d) / 2880(2d) / 4320(4d) / 10080(7d) / 21600(15d)
// 用时间戳(ms)记录 due,支持分钟级短期复习
const SRS_INTERVALS_MIN = [5, 30, 720, 1440, 2880, 4320, 10080, 21600];
const SRS_LEVEL_NAME = ['5分钟后','30分钟后','12小时后','1天后','2天后','4天后','7天后','15天后'];
let __srsUseRefresh = false; // 单词页手动刷新标志(一次性)
let __srsRenderTimer = null; // 学词后延迟重渲染定时器(可被刷新取消)
let __englishView = 'new';   // 英语页当前视图: 'new' 今日新学 | 'review' 待复习
function setEnglishView(v){
  __englishView = (v==='review') ? 'review' : 'new';
  renderPage('english');
}
function getStudyDays(){
  const s = getSRS();
  const days = s.meta.studyDays || [];
  return days.length;
}
// 解析 w[2] "adv. 在国外..." -> {pos:'adv.', meaning:'在国外...'}
function parseWM(w){
  const t = (w && w[2] ? String(w[2]) : '').trim();
  // 严格匹配: 词性 = 字母(1-3 个) + "." + 任意空白; 后面任意前导点/空白后才是释义
  // 用 word boundary + 完整词性列表避免 "v." 误匹配 "adv." 子串
  const POS_LIST = ['n.','v.','adj.','adv.','prep.','conj.','pron.','int.','num.','art.','aux.'];
  for(const pos of POS_LIST){
    // 必须以行首/空格开始 + pos + 任意空白/点
    const idx = t.indexOf(' ' + pos);
    if(idx >= 0){
      // 切掉 " pos" 后, 再去掉前导的空白和点
      let after = t.slice(idx + 1 + pos.length).replace(/^[\s\.]+/, '');
      return { pos, meaning: after || t };
    }
    // 也允许 pos 在开头(行首无空格)
    if(t.startsWith(pos)){
      let after = t.slice(pos.length).replace(/^[\s\.]+/, '');
      return { pos, meaning: after || t };
    }
  }
  return { pos:'', meaning: t };
}
// 本地词性模板: 按词性自动生成简短英文+中文例句 (无需外部 AI)
const EX_TPL = {
  'n.':     ['Could you give me a brief about the {w}?',                '您能简单说一下这个吗？'],
  'v.':     ['We need to {w} this carefully in our meeting.',            '我们需要在会议中认真处理这件事。'],
  'adj.':   ['The result is highly {w} to our team today.',              '这个结果对我们团队今天非常关键。'],
  'adv.':   ['This task will be done {w}, as we planned.',               '这项任务会按计划准时完成。'],
  'prep.':  ['Please send the file {w} the deadline tomorrow.',          '请在截止前发送文件。'],
  'conj.':  ['Please note {w} the deadline has been fixed.',             '请注意截止时间已经确定。'],
  'pron.':  ['{w} of the points raised in the report are valid.',        '您提出的观点大多都是合理的。'],
  'int.':   ['{w} this is a great result for everyone!',                '太好了，这对大家都是一个很棒的结果！'],
  'art.':   ['This is {w} important email for the team.',                '这是一封对团队很重要的邮件。'],
  'aux.':   ['You {w} need to review the contract carefully.',          '您确实需要仔细审核这份合同。'],
  'num.':   ['We have processed {w} cases this month.',                  '这个月我们已经处理了这些案例。'],
  'default':['Please refer to the term "{w}" in the report.',            '请在报告中查看 "{w}" 这一项。']
};
function genExample(w){
  const { pos } = parseWM(w);
  const word = String(w[0] || '').trim();
  const wordCap = word.charAt(0).toUpperCase() + word.slice(1);
  const tpl = EX_TPL[pos] || EX_TPL['default'];
  // 替换 {w} (词性 n./v./adj./adv. 模板里有 {w} 占位)
  let en = tpl[0].replace(/\{w\}/g, pos === 'n.' || pos === 'v.' || pos === 'adj.' ? word : (pos === 'adv.' || pos === 'prep.' || pos === 'conj.' ? word : wordCap));
  // 兜底: 词性映射后还是不自然时用 default
  if(EX_TPL[pos]){
    return { en, cn: tpl[1] };
  }
  return { en: EX_TPL['default'][0].replace(/\{w\}/g, wordCap), cn: EX_TPL['default'][1] };
}
function getSRS(){
  return Store.get('wws:srs', {
    words:{},        // { word: { level:0~7, due:timestamp(ms), learned:true, last:timestamp } }
    meta:{ totalLearned:0, firstDay:0, todayKey:'', todayNewDone:0, todayReviewDone:0 }
  });
}
function setSRS(s){ Store.set('wws:srs', s); }
function ensureSRSSeed(){
  const s = getSRS();
  if(s.meta.firstDay && s.meta.firstDay > 0) return; // 已经初始化过
  s.meta.firstDay = dayIndex();
  s.meta.totalLearned = 0;
  s.meta.todayKey = todayStr();
  s.meta.todayNewDone = 0;
  s.meta.todayReviewDone = 0;
  s.meta.studyDays = s.meta.studyDays || [];
  setSRS(s);
}
// 稳定洗牌:按词首字母 + 日偏移,保证每天/每次刷新内容稳定不重复
function srsShuffle(arr, salt){
  return [...arr].sort((a,b) => {
    const ka = (a[0].charCodeAt(0)*31 + salt*7) % 997;
    const kb = (b[0].charCodeAt(0)*31 + salt*7) % 997;
    return ka - kb;
  });
}
function srsTodayQueue(){
  ensureSRSSeed();
  const s = getSRS();
  const now = Date.now();
  const all = __DATA_BEC__;
  const fresh = [];  // 从未学过的(后台全量,页面只呈现未学)
  const due = [];    // 已学过且到期的(复习)
  for(const w of all){
    const rec = s.words[w[0]];
    if(!rec) fresh.push(w);
    else if(rec.due <= now) due.push(w);
  }
  // salt 用「日期 + 已学数量」,让刷新按钮能换不同的一批(但不含已学)
  const salt = dayIndex() * 7 + Object.keys(s.words).length;
  return {
    newWords: fresh,
    reviewWords: due
  };
}
// 手动刷新:扩展 salt,从「未学过」的词里重新取一批(不含已学)
let __srsRefreshSalt = 0;
function srsRefreshSalt(){ __srsRefreshSalt++; }
function srsTodayQueueRefresh(){
  ensureSRSSeed();
  const s = getSRS();
  const now = Date.now();
  const all = __DATA_BEC__;
  const fresh = all.filter(w => !s.words[w[0]]);
  const due = all.filter(w => s.words[w[0]] && s.words[w[0]].due <= now);
  const salt = dayIndex()*7 + Object.keys(s.words).length + __srsRefreshSalt*131;
  return { newWords: fresh, reviewWords: due };
}
function srsAction(word, action){
  const s = getSRS();
  // 确保当日计数器已重置
  if(s.meta.todayKey !== todayStr()){
    s.meta.todayKey = todayStr();
    s.meta.todayNewDone = 0;
    s.meta.todayReviewDone = 0;
  }
  const rec = s.words[word];
  const isNew = !rec;
  const now = Date.now();
  if(isNew){
    // 第一次学:进第 0 级,5 分钟后到期(艾宾浩斯短期记忆窗口)
    const tdy = todayStr();
    s.words[word] = { level:0, due: now + SRS_INTERVALS_MIN[0]*60000, learned:true, last:now, firstLearnedDate: tdy };
    s.meta.totalLearned = (s.meta.totalLearned||0) + 1;
    s.meta.todayNewDone = (s.meta.todayNewDone||0) + 1;
    // 真实坚持天数:把今天日期写入 studyDays(去重)
    s.meta.studyDays = s.meta.studyDays || [];
    if(!s.meta.studyDays.includes(tdy)) s.meta.studyDays.push(tdy);
  } else {
    // 艾宾浩斯 + SRS 混合记忆法:
    //   yes  → 升级一级(拉长间隔,符合艾宾浩斯)
    //   vague → 降一级(缩短间隔,在艾宾浩斯基础上提前一个阶段复习)
    //   no   → 回到第 0 级(立即再考)
    if(action==='yes'){
      rec.level = Math.min(SRS_INTERVALS_MIN.length-1, rec.level + 1);
    } else if(action==='vague'){
      rec.level = Math.max(0, rec.level - 1);
    } else { // no 忘记
      rec.level = 0;
    }
    rec.due = now + SRS_INTERVALS_MIN[rec.level]*60000;
    rec.last = now;
    rec.learned = true;
    s.meta.todayReviewDone = (s.meta.todayReviewDone||0) + 1;
  }
  setSRS(s);
}

  return Store.get('wws:exercise:log:' + (date||todayStr()), {date:date||todayStr(), items:[]});

function exSumLog(log){
  return (log && log.items ? log.items : []).reduce((s, it) => s + (Number(it.kcal) || 0), 0);

function exSaveRecord(date, kcal, activity){
  // 追加一条运动记录(每条独立千卡),今日总消耗 = 各条求和(联动每日饮食)
  const log = exGetLog(date);
  log.date = date; log.items = log.items || [];
  log.items.push({activity: activity || '运动消耗', kcal: Number(kcal) || 0});
  Store.set('wws:exercise:log:' + date, log);
  Store.set('wws:exercise:kcal:' + date, exSumLog(log));
  const cks = exGetCheckins();
  cks[date] = true;
  Store.set('wws:exercise:checkins', cks);
}
function exGetKcalOf(date){
  return exSumLog(exGetLog(date));
}
function exDelRecord(date, idx){
  const log = exGetLog(date);
  if(!log.items || !log.items[idx]) return;
  const removed = log.items.splice(idx, 1)[0];
  Store.set('wws:exercise:log:' + date, log);
  Store.set('wws:exercise:kcal:' + date, exSumLog(log));
  if(!log.items.length){
    const cks = exGetCheckins(); delete cks[date]; Store.set('wws:exercise:checkins', cks);
  }
  showToast('🗑 已删除「' + (removed.activity || '运动') + '」记录');

      src.start(0);

      if(myToken !== __playToken) return;            // 已被打断,不再回退

        stopAllAudio();

        a.playsInline = true; a.setAttribute('playsinline',''); a.setAttribute('webkit-playsinline','true');
        a.src = url; __lastAudio = a; __curAudio = a; __curKey = key; __curPlaying = true;

function splitTts(text, maxLen){
  if(!text) return [];
  const segs = [];
  let buf = '';
  const push = () => { if(buf.trim()){ segs.push(buf.trim()); buf=''; } };
  for(const ch of text){
    buf += ch;
    if((ch === '。' || ch === '.' || ch === '！' || ch === '!' || ch === '？' || ch === '?' || ch === '\n') && buf.length >= maxLen*0.5){
      push();
    } else if(buf.length >= maxLen){
      push();
    }
  }
  push();
  return segs.length ? segs : [text];
}
function ttsByServer(text, btn, lang, done){

  let idx = 0;
  if(btn){ btn.dataset.ttsOn = '1'; btn.dataset.ttsOld = btn.innerHTML; btn.innerHTML = '⏳ 合成中…'; }
  function finish(){
    if(btn){ btn.dataset.ttsOn = '0'; btn.innerHTML = btn.dataset.ttsOld || '▶ 播放'; }
    __curKey = null; __curPlaying = false;
    if(done) done();
  }
  function playNext(){
    if(idx >= parts.length){ finish(); return; }
    const seg = parts[idx++];
    playUrl('/api/tts?lang=' + (lang||'zh') + '&text=' + encodeURIComponent(seg), 'tts:' + text, function(err){
      if(err){ if(btn) showToast('🔇 语音合成失败,请检查网络'); finish(); return; }

// 从公开 iTunes Search API 拉取真实播客(免 key、支持 CORS),多关键词去重后缓存数十篇
async function fetchPodcastsFromAPI(){
  const terms = ['自我提升','英语口语','商业思维','科技前沿','心理成长','职场沟通','投资理财','历史文化','英语听力','创业思维','english learning','business','technology','self improvement','history','psychology'];
  const ctrl = new AbortController();
  const to = setTimeout(()=> ctrl.abort(), 11000);
  try{
    const settled = await Promise.all(terms.map(t =>
      fetch('https://itunes.apple.com/search?media=podcast&entity=podcast&limit=10&term=' + encodeURIComponent(t), { signal: ctrl.signal })
        .then(r => r.ok ? r.json() : null)
        .catch(()=> null)
    ));
    clearTimeout(to);
    const seen = new Set(); const out = [];
    for(const d of settled){
      if(!d || !d.results) continue;
      for(const x of d.results){
        if(!x.collectionId) continue;
        const id = String(x.collectionId);
        if(seen.has(id)) continue;
        seen.add(id);
        out.push({
          id,
          title: x.collectionName || x.trackName || '未知播客',
          image: x.artworkUrl600 || x.artworkUrl100 || '',
          genre: x.primaryGenreName || (x.genres && x.genres[0]) || '播客',
          artist: x.artistName || '',
          desc: (x.description || '').replace(/<[^>]+>/g, '\n').replace(/&[a-zA-Z#0-9]+;/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{2,}/g, '\n').trim(),
          episodes: x.trackCount || 0,
          feed: x.feedUrl || '',
          url: x.collectionViewUrl || '',
          updated: x.releaseDate || '',
          builtin: false
        });
      }
    }
    return out;
  }catch(_){ return []; }
}

function renderSpeak(){

function playSentenceFromBtn(btn, si, i){

function playSentence(text, si, i){

function renderRecHistory(){
  const recs = Store.get('wws:recs', []);
  if(!recs.length) return '<div style="text-align:center;color:var(--text-soft);padding:20px;font-size:13px">还没有录音,完成第一次朗读后会自动保存</div>';

function playRecFromMap(text){
  const url = __recMap[text];
  if(!url){ showToast('未找到该句录音'); return; }
  const key = 'rec:' + text;
  if(_isCurPlaying(key)){ stopAllAudio(); return; }
  stopAllAudio();
